<!doctype html>
<html lang="sk" data-skin="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Zdieľňa – trhovisko na zdieľanie elektriny so susedmi. Hackathon 2026, prototyp.">
<title>Zdieľňa</title>
<link rel="icon" href="assets/zdielna-dot.svg">
<meta name="theme-color" content="#1E1B22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zdieľňa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Zdieľňa – dizajnové tokeny
   Jediné miesto, kde sa definujú farby, písmo a rozmery. Komponenty
   (app.css, landing.css) používajú iba var(--…), nikdy priamy hex.

   Značkové farby sú prevzaté zo zse.sk a vse.sk (ich CSS, okt. 2026).
   Kontrast textu je overený voči WCAG AA (≥ 4,5 : 1):
   - ZSE červená #F21C0A má na bielej iba 4,25 : 1 → na malý text
     a odkazy používame --brand-ink (#B1190C), červenú len na plochy
     a tučné tlačidlá.
   - VSE azúrová #01A0D5 má 3 : 1 → iba plochy, ikony a grafy.
   Aplikácia je zámerne iba svetlá (projektor, menej testovania).
   ===================================================================== */
:root{
  color-scheme:light;

  /* písmo – Figtree používa VSE; ZSE má systémové písmo, takže nekoliduje */
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fs-xs:12px;   /* minimum – nič menšie */
  --fs-sm:13px;
  --fs-md:15px;   /* bežný text */
  --fs-lg:17px;   /* úvodný odsek (lead) */
  --fs-h3:17px;
  --fs-h2:22px;
  --fs-h1:32px;
  --fs-display:clamp(40px,5vw,68px);

  /* plochy a text */
  --bg:#FBF9F5;          /* krémové pozadie stránky */
  --card:#FFFFFF;
  --ink:#1E1B22;         /* hlavný text */
  --mut:#5F6170;         /* sekundárny text – 5,8 : 1 na --bg */
  --line:#E8E3DB;
  --line-2:#D6CFC4;      /* výraznejší okraj (outline tlačidlá) */
  --tint-warm:#F6EEE4;   /* sekcie pre výrobcu */
  --tint-green:#ECF1E6;  /* sekcie pre odberateľa */
  --tint-cool:#EAF0F7;

  /* tmavý pás (hero, klub) – prepisuje ho skin */
  --surface-dark:#1E1B22; --surface-dark-2:#141218;
  --on-dark:#ECE9F1;
  --on-dark-mut:#B9B4C4;
  --line-dark:rgba(255,255,255,.14);

  /* rozmery */
  --r-sm:10px;
  --r:16px;
  --r-lg:22px;
  --r-pill:999px;        /* tlačidlá – obe značky používajú zaoblené „pill“ */
  --sh:0 1px 2px rgba(30,27,34,.05),0 6px 18px rgba(30,27,34,.06);
  --sh-lg:0 18px 50px rgba(30,27,34,.14);

  /* pevné značky (strechy na mape) */
  --zse:#F21C0A; --vse:#143C8C;
  /* mapa regiónov – tmavý jazyk hero; stred (SSE) je mimo služby */
  --map-zse:#5A3436; --map-zse-ink:#FF8A7A; --map-zse-roof:#E8705F;
  --map-sse:#4E4032; --map-sse-ink:#F2B062;
  --map-vse:#3A3E55; --map-vse-ink:#8FB3F2; --map-vse-roof:#6C8FD6;
  --map-edge:rgba(255,255,255,.22); --map-tree:#7FA088; --map-wall:#F4ECE0; --map-wall-2:#D6CBBD; --map-flow:#F5B33A;
  --map-bat:#B79BF2; --map-gift:#FF9EC0;

  /* slniečko – uvítacia hláška */
  --sun-1:#FFF6C2; --sun-2:#FFC530; --sun-3:#F59E0B; --sun-edge:#FFE08A; --sun-ink:#5A3A00; --sun-glow:rgba(255,197,48,.18);
  --sun-bg:#FFF8E6;

  /* stavové farby na tmavom páse a drobnosti (žiadny hex mimo tokenov) */
  --on-dark-ok:#CDEAA0; --on-dark-warn:#FFC08A; --on-dark-err:#FFD2C3; --online:#2FD36B; --roof-mix:#F2C2A0;

  /* červená bodka – podpis značky Zdieľňa (logo, koniec nadpisov); rovnaká vo všetkých skinoch, iba dekoratívna */
  --sig:#E5322D;

  /* nočná scéna úvodu – polárna žiara, sklenené karty, žiariace okná (dekor) */
  --aurora-1:#2EE6A8; --aurora-2:#7C5CFF; --aurora-3:#22D3EE;
  --night-glass:rgba(11,20,36,.74); --accent-glow:rgba(94,234,181,.2); --window-glow:#FFD27A;

  /* batéria – mimo palety značiek, rovnaká v oboch */
  --purple:#6A35C0; --purple-t:#F0E8FB;
}

/* ---------- ZSE ---------- */
:root[data-skin="zse"]{
  --brand:#F21C0A; --brand-d:#B1190C; --brand-ink:#B1190C; --brand-t:#FDE9E6; --on-brand:#FFFFFF;
  --brand2:#0AACF2;                       /* sekundárna modrá zo zse.sk */
  /* tmavé plochy ZSE sú tmavo červené (ako VSE tmavomodré) – kontrast textu overený:
     #F6E7E4 10 : 1, #F2C0B6 7,5 : 1, akcent #FFC9A3 8,1 : 1 */
  --surface-dark:#6E1009; --surface-dark-2:#4D0B06; --accent-dark:#FFC9A3; --on-dark:#F6E7E4; --on-dark-mut:#F2C0B6;
  --map-zse:#9A2C22; --map-sse:#5C3A26; --map-vse:#4A3E5E; --map-zse-ink:#FFC9A3; --map-vse-ink:#C2D3F7;

  --yellow:#FFA800; --yellow-ink:#8A5800; --yellow-t:#FFF2D6;   /* výroba / slnko */
  --green:#4E7210;  --green-t:#EEF4E0;                          /* zdieľané / úspech */
  --blue:#0A6E9C;   --blue-t:#E1F4FD;                           /* spotreba / info */
  --orange:#9E4A0A; --orange-t:#FDEBDD;                         /* výkup / upozornenie */
  --red:#B1190C;    --red-t:#FDE9E6;
}

/* ---------- Neutrálna (úvod a registrácia – bez značky ZSE/VSE) ----------
   Nočný štýl: tmavomodrá obloha s polárnou žiarou, mätový akcent, žiariace okná.
   Kontrast: akcent #5EEAB5 na #0B1424 12 : 1, text #0B1424 na #0E9F6E 5,4 : 1,
   --brand-ink #0B6B4C na bielej 6,5 : 1, ikony #0E9F6E na bielej 3,4 : 1. */
:root[data-skin="neutral"]{
  --brand:#0E9F6E; --brand-d:#34D399; --brand-ink:#0B6B4C; --brand-t:#E3F7EF; --on-brand:#0B1424;
  --brand2:#7C5CFF;
  --surface-dark:#0B1424; --surface-dark-2:#070E1A; --accent-dark:#5EEAB5; --on-dark:#EAF2F8; --on-dark-mut:#A8B6C8;

  --yellow:#FFA800; --yellow-ink:#8A5800; --yellow-t:#FFF2D6;
  --green:#4E7210;  --green-t:#EEF4E0;
  --blue:#0A6E9C;   --blue-t:#E1F4FD;
  --orange:#9E4A0A; --orange-t:#FDEBDD;
  --red:#B1190C;    --red-t:#FDE9E6;
}

/* ---------- VSE ---------- */
:root[data-skin="vse"]{
  --brand:#143C8C; --brand-d:#0E2C68; --brand-ink:#143C8C; --brand-t:#E3EAF7; --on-brand:#FFFFFF;
  --brand2:#01A0D5;                       /* azúrová zo vse.sk */
  --surface-dark:#0E2C68; --surface-dark-2:#091E4A; --accent-dark:#6FD0F2; --on-dark-mut:#A9BEE3;
  --map-zse:#5A3446; --map-sse:#4E4636; --map-vse:#2D5099; --map-vse-ink:#B8D8FA;

  --yellow:#F5A623; --yellow-ink:#8A5800; --yellow-t:#FFF2D6;
  --green:#3A7316;  --green-t:#E9F3E1;   /* #5EA62B z vse.sk, stmavené pre text */
  --blue:#0B6E98;   --blue-t:#E1F4FB;    /* #01A0D5, stmavené pre text */
  --orange:#A84E0C; --orange-t:#FDEBDD;  /* #EC721A, stmavené pre text */
  --red:#B02A37;    --red-t:#FBE7E9;
}

/* Sémantika grafov – rovnaký význam v celej aplikácii aj na úvode */
:root{
  --c-prod:var(--yellow);    /* výroba / prebytok */
  --c-cons:var(--blue);      /* spotreba */
  --c-shared:var(--green);   /* zdieľaná časť */
  --c-bat:var(--purple);     /* batéria */
  --c-grid:var(--orange);    /* výkupca / sieť */
}

</style>
<style>
/* =====================================================================
   Zdieľňa – spoločné komponenty (aplikácia aj úvodná stránka).
   Iba var(--…) z tokens.css. Nový komponent pridávajte sem, nie do view.
   ===================================================================== */
[hidden]{display:none!important}

/* ---------- základ ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:var(--fs-md);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:var(--fs-h1);font-weight:800}h2{font-size:var(--fs-h2);font-weight:800}h3{font-size:var(--fs-h3);font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.skel{background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sk 1.1s linear infinite;border-radius:8px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- typografia a pomocné triedy ---------- */
.kicker{display:block;font-size:var(--fs-xs);letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--brand-ink);margin-bottom:12px}
.lead{font-size:var(--fs-lg);color:var(--mut);max-width:600px;margin-top:14px;line-height:1.6}
.note{font-size:var(--fs-xs);color:var(--mut);margin-top:16px;line-height:1.6}
.link{padding:0;border:0;background:none;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:5px;font-size:var(--fs-sm);color:inherit}
.icon{width:22px;height:22px;flex:none;display:block}
.mut{color:var(--mut)}.sm{font-size:var(--fs-sm)}.xs{font-size:var(--fs-xs)}.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.spacer{flex:1}
.kbd{font-variant-numeric:tabular-nums}
.warn{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- tlačidlá (jedna sada pre celú aplikáciu) ---------- */
.btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:10px 18px;border-radius:var(--r-pill);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .15s;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.btn.pri:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.dark{background:var(--surface-dark);border-color:var(--surface-dark);color:#fff}.btn.dark:hover{background:var(--surface-dark-2);border-color:var(--surface-dark-2)}
.btn.light{background:#fff;border-color:#fff;color:var(--ink)}.btn.light:hover{background:var(--bg)}
.btn.ghost{background:transparent;border-color:var(--line-dark);color:var(--on-dark)}.btn.ghost:hover{border-color:var(--on-dark)}
.btn.out{background:transparent}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:7px 13px;font-size:var(--fs-sm)}
.btn.lg{padding:15px 26px;font-size:var(--fs-lg);font-weight:800}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(1px)}

/* ---------- štítky ---------- */
.pill{display:inline-flex;gap:5px;align-items:center;padding:4px 11px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;border:1px solid transparent;line-height:1.3}
.pill.g{background:var(--green-t);color:var(--green)}.pill.y{background:var(--yellow-t);color:var(--yellow-ink)}.pill.b{background:var(--blue-t);color:var(--blue)}.pill.o{background:var(--orange-t);color:var(--orange)}.pill.r{background:var(--red-t);color:var(--red)}.pill.n{background:var(--bg);color:var(--mut);border-color:var(--line)}.pill.p{background:var(--purple-t);color:var(--purple)}
.pill.c{background:var(--tint-warm);color:var(--ink)}
.pill.vis{background:var(--purple-t);color:var(--purple);border-color:var(--purple)}

/* ---------- horná lišta a navigácia ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 24px;flex-wrap:wrap}
.top .btn:not(.pri):not(.dark){background:transparent}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.03em;background:none;border:0;color:var(--ink);padding:0}
.brand img{height:30px;border-radius:6px;display:block}
.brand .dot,.sig{color:var(--sig)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:var(--r-pill);color:var(--mut);font-weight:700}
.seg button[aria-pressed=true]{background:var(--surface-dark);color:#fff}
.shell{display:flex;min-height:calc(100vh - 66px)}
.side{width:228px;flex:none;padding:22px 14px;background:var(--bg);position:sticky;top:66px;align-self:flex-start;height:calc(100vh - 66px);overflow:auto}
.side button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-radius:var(--r-pill);font-weight:700;color:var(--mut);margin-bottom:3px;font-size:var(--fs-md)}
.side button:hover{background:var(--tint-warm);color:var(--ink)}
.side button[aria-current=page]{background:var(--surface-dark);color:#fff}
.side button[aria-current=page] .icon{color:var(--accent-dark)}
.side .ic{width:22px;display:grid;place-items:center}
.side .ic .icon{width:19px;height:19px}
.side .sub{padding-left:26px;font-size:var(--fs-sm)}
.side .sub .icon{width:16px;height:16px}
.side .lbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.14em;color:var(--brand-ink);font-weight:800;margin:22px 14px 8px}
.side .lbl-t{font-size:var(--fs-xs);color:var(--mut);margin:-4px 14px 8px;font-weight:600}
.main{flex:1;min-width:0;padding:28px 32px;max-width:1220px;margin:0 auto;width:100%;padding-bottom:120px}
.pub .side,.pub .bnav{display:none!important}
.pub .main{max-width:1080px}
.bnav{display:none}
@media (max-width:820px){
 .side{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;border:0;background:none;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-xs);font-weight:700;color:var(--mut);min-height:54px}
 .bnav button[aria-current=page]{color:var(--brand-ink)}
 .bnav .icon{width:21px;height:21px}
 .main{padding:16px;padding-bottom:140px}
 :root{--fs-h1:26px;--fs-h2:20px}
 .top{gap:8px;padding:10px 14px}
 .top .hide-m{display:none}
 .top .seg button{padding:6px 10px;font-size:var(--fs-sm)}
 .sim{position:static}
 .brand img{height:28px}
}
@media (max-width:440px){.brand span{display:none}}

/* ---------- karty a mriežky ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;min-width:0}
.card>h2,.card>.row>h2,.card>.row>div>h2{letter-spacing:-.035em}
.card+.card,.gap>*+*{margin-top:20px}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid>.card,.grid>*{margin-top:0!important}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.045em;margin-top:6px;line-height:1.1}
.kpi .l{color:var(--mut);font-size:var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.kpi .d{font-size:var(--fs-xs);color:var(--mut);margin-top:2px}

/* ---------- hero – rovnaký jazyk ako úvodná stránka (lp-hero, lp-club) ----------
   Každá obrazovka začína tmavým pásom: kicker → veľký nadpis → lead → akcie,
   vpravo voliteľne „plávajúce“ kartičky s číslami (ako na úvode). */
.hero{background:linear-gradient(135deg,var(--surface-dark) 0%,var(--surface-dark-2) 100%);color:var(--on-dark);border:0;border-radius:24px;padding:28px 32px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:760px;height:760px;right:-200px;top:-330px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent-dark) 24%,transparent),transparent 70%);pointer-events:none}
.hero:after{content:'';position:absolute;width:340px;height:340px;right:-90px;top:50%;margin-top:-170px;border-radius:50%;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:24px;align-items:center}
.hero-grid.one{grid-template-columns:minmax(0,1fr)}
.hero h1{font-size:clamp(26px,2.9vw,38px);line-height:1.08;letter-spacing:-.04em;font-weight:800;margin:0;color:#fff;max-width:24ch}
.hero h1 em{font-style:normal;color:var(--accent-dark)}
.hero h1 small{display:block;font-size:var(--fs-md);font-weight:600;letter-spacing:0;color:var(--on-dark-mut);margin-top:10px}
.hero .lead{color:var(--on-dark);max-width:560px;margin-top:10px;font-size:var(--fs-md);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .kicker{color:var(--accent-dark)}
.hero-acts{margin-top:18px;gap:10px}
.hero .sm,.hero .mut,.hero .xs{color:var(--on-dark-mut)}
.hero b{color:#fff}
.hero .lp-float b,.hero .hstat b,.hero .lp-float,.hero .hstat{color:var(--ink)}
.hero .lp-float .positive{color:var(--green)}
.hero .btn{background:#fff;color:var(--ink);border-color:#fff}
.hero .btn:hover{background:var(--bg)}
.hero .btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.hero .btn.ghost{background:transparent;color:var(--on-dark);border-color:var(--line-dark)}
.hero .btn.ghost:hover{border-color:var(--on-dark)}
.hero .pill.n{background:transparent;color:var(--on-dark);border-color:var(--line-dark)}
.hero .pill.g{background:rgba(255,255,255,.1);color:var(--on-dark-ok)}
.hero .pill.o{background:rgba(255,255,255,.1);color:var(--on-dark-warn)}
.hero .seg{background:rgba(255,255,255,.07);border-color:var(--line-dark)}
.hero .seg button{color:var(--on-dark)}
.hero .seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.hero .bar{background:rgba(255,255,255,.12);border-color:transparent}
.hero .steps .step{color:var(--on-dark-mut)}.hero .steps .step.done{color:#fff}
.hero .step .d{border-color:var(--line-dark)}
.hero-checks{display:flex;gap:18px;font-size:var(--fs-sm);color:var(--on-dark);margin-top:16px;flex-wrap:wrap}
.hero-checks span{display:flex;gap:7px;align-items:center}
.hero-checks i{width:6px;height:6px;border-radius:50%;background:var(--accent-dark);display:inline-block}
.hero-foot{border-top:1px solid var(--line-dark);margin-top:32px;padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--on-dark-mut);font-size:var(--fs-sm)}
.hero-tabs{margin-top:18px}
/* plávajúce kartičky s číslami (ako .lp-float) */
.hero-aside{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.hstat{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.22);font-size:var(--fs-xs);min-width:180px;max-width:260px;transform:rotate(1.5deg)}
.hstat:nth-child(2){transform:rotate(-1.5deg);margin-right:28px}
.hero-aside .hstat:nth-child(n+3){display:none}
.hstat .tag{display:block;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800}
.hstat b{display:block;color:var(--ink);font-size:20px;font-weight:800;letter-spacing:-.04em;margin:4px 0 2px;line-height:1.1}
.hstat span:last-child:not(.tag){color:var(--mut)}
.hstat .pos{color:var(--green);font-weight:700}
.hstat.live .tag{display:flex;gap:6px;align-items:center}.hstat.live .tag:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--brand)}
/* scéna z úvodu v hero (Domov) */
.hero-scene{position:relative;min-width:0;width:100%;max-width:520px;margin:-30px -10px -40px 0}
.hero-scene>svg{width:100%;height:auto;display:block}
.hero-scene .lp-float b{font-size:22px}
/* záhlavie sekcie: kicker + nadpis vľavo, lead vpravo (ako .lp-section-head) */
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:28px;margin:44px 0 18px}
.sec-head:first-child{margin-top:0}
.sec-head h2{font-size:clamp(24px,2.6vw,34px);letter-spacing:-.045em;line-height:1.1;max-width:20ch}
.sec-head .lead{max-width:380px;margin:0;font-size:var(--fs-md)}
/* stavový pás v hero (namiesto samostatnej karty) */
.hero-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.page-head{padding:6px 2px 4px}
.page-head h1{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.04em}
@media (max-width:1000px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-aside{align-items:flex-start;flex-direction:row;flex-wrap:wrap}.hstat:nth-child(2){margin-right:0}.hero-scene{max-width:520px;margin:0}}
@media (max-width:820px){.hero{padding:22px 18px;border-radius:var(--r-lg)}.hstat{min-width:0;flex:1 1 180px;transform:none!important}.sec-head{flex-direction:column;align-items:start;gap:10px;margin-top:32px}}

/* ---------- karty ponúk (trhovisko) – ako .lp-offer ---------- */
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.ocard{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card);display:flex;flex-direction:column;min-width:0}
.ocard.best{border:2px solid var(--green)}
.ocard-art{height:84px;background:var(--yellow-t);position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--yellow-ink)}
.ocard.eve .ocard-art{background:var(--purple-t);color:var(--purple)}
.ocard.dem .ocard-art{background:var(--blue-t);color:var(--blue)}
.ocard-art .icon{width:36px;height:36px}
.ocard-art .pill{background:rgba(255,255,255,.8)}
.ocard-body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.ocard-body h3{font-size:19px;letter-spacing:-.025em}
.ocard-price{font-size:34px;font-weight:800;letter-spacing:-.045em;margin:12px 0 4px;line-height:1.1}
.ocard-price span{font-size:var(--fs-sm);font-weight:500;letter-spacing:0;color:var(--mut)}
.ocard-match{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:14px 0 16px;margin-top:12px}
.ocard-match .bar{flex:1}
.ocard-match b{font-size:var(--fs-md)}
.ocard .row.acts{margin-top:auto}

/* ---------- skupiny s obsadenosťou ---------- */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.gcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard.cur{border:2px solid var(--green);background:color-mix(in srgb,var(--green-t) 45%,var(--card))}
.gcard h3{font-size:20px;letter-spacing:-.03em}
.gcard .occ{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--mut)}
.gcard .occ b{color:var(--ink)}
.gcard .row.acts{margin-top:auto;padding-top:6px}
.gopt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--card)}
.gopt:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.gopt input{margin-top:3px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.gopt .grow{flex:1;min-width:0}
.gopt.full{opacity:.6;cursor:not-allowed}

/* ---------- formuláre ---------- */
.f{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);font-weight:600;color:var(--mut);min-width:0}
.fi{display:flex;align-items:center;gap:6px}
.f input,.f select,.f textarea,.inp{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}
.f input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--brand)}
.f em{font-style:normal;color:var(--mut);font-weight:600;white-space:nowrap}
.f.chk{flex-direction:row;align-items:center;gap:8px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields.one{grid-template-columns:minmax(0,1fr)}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.fields,.fields.three{grid-template-columns:minmax(0,1fr)}}
input[type=range]{width:100%;accent-color:var(--brand)}

/* ---------- panel parametrov, modály ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--line);z-index:60;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:18px;box-shadow:-12px 0 30px rgba(0,0,0,.15);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer h3{margin:18px 0 8px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,26,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal.wide{max-width:820px}

/* ---------- tabuľky ---------- */
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.tw th,.tw td{white-space:nowrap}
th{color:var(--mut);font-weight:700;font-size:var(--fs-xs)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow:auto;max-height:340px}

/* ---------- priebeh, ponuky ---------- */
.bar{height:10px;border-radius:var(--r-pill);background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--green)}
.bar.b>i{background:var(--blue)}.bar.y>i{background:var(--yellow)}.bar.o>i{background:var(--orange)}.bar.p>i{background:var(--purple)}
.steps{display:flex;gap:6px 12px;flex-wrap:wrap}
.step{display:flex;gap:6px;align-items:center;font-size:var(--fs-sm);font-weight:600;color:var(--mut)}
.step .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);font-size:var(--fs-xs)}
.step.done .d{background:var(--green);border-color:var(--green);color:#fff}.step.now .d{border-color:var(--orange);color:var(--orange);background:var(--orange-t)}
.step.done{color:var(--ink)}
.offer{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--card);min-width:0}
.offer.best{border:2px solid var(--green)}
.offer.eve{border-left:5px solid var(--purple)}
.heat{display:grid;grid-template-columns:40px repeat(5,1fr);gap:4px;font-size:var(--fs-xs);font-weight:700;text-align:center}
.heat div{padding:8px 2px;border-radius:8px}
.h0{background:var(--bg);color:var(--mut)}
.h1{background:color-mix(in srgb,var(--green) 18%,#fff);color:var(--green)}
.h2{background:color-mix(in srgb,var(--green) 45%,#fff);color:color-mix(in srgb,var(--green) 70%,#000)}
.h3{background:var(--green);color:#fff}
.sim{position:sticky;top:76px;z-index:20;border-radius:var(--r-pill);padding:10px 14px 10px 10px!important;box-shadow:var(--sh)}
.role{cursor:pointer;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;color:var(--ink)}
.role[aria-pressed=true]{border-color:var(--brand);background:var(--brand-t)}

/* ---------- oznámenia ---------- */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--surface-dark);color:#fff;padding:11px 18px;border-radius:var(--r-pill);font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:95;max-width:92vw;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
.cap{position:fixed;left:12px;right:12px;bottom:78px;z-index:85;background:var(--surface-dark);color:#fff;border-radius:var(--r);padding:12px 16px;display:none;gap:12px;align-items:center;max-width:720px;margin:0 auto}
.cap.show{display:flex}
.foot{margin-top:20px;padding:11px 14px;border-radius:var(--r-sm);background:var(--tint-warm);color:var(--ink);font-size:var(--fs-xs);line-height:1.6;border:1px solid var(--line)}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.upd{animation:pop .5s}@keyframes pop{0%{background:var(--yellow-t)}100%{background:transparent}}

/* ---------- výhody, registrácia ---------- */
.ben .big{font-size:clamp(36px,5vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.ben .col{border-top:6px solid var(--brand)}
.ben .col.c2{border-top-color:var(--green)}
.bens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.bens{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bens>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bens .icon{color:var(--brand)}
.bens b{display:block;margin:8px 0 2px}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:24px;color:var(--ink);transition:border-color .15s,transform .15s}
.choice:hover{border-color:var(--brand);transform:translateY(-2px)}
.choice h2{font-size:var(--fs-h2)}
.choice>.icon{width:32px;height:32px;color:var(--brand)}
.logos{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.logos button{border:2px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:8px 18px 8px 10px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink)}
.logos button:hover{border-color:var(--brand)}
.logos img{height:30px;border-radius:5px}
.chk-list>div{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:600}
.chk-list .ok{color:var(--green)}.chk-list .wait{color:var(--mut)}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- AI asistent ---------- */
.fab{position:fixed;right:18px;bottom:22px;z-index:80;width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;place-items:center}
.fab .icon{width:26px;height:26px}
.fab .dot{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--online);border:2px solid var(--brand)}
@media (max-width:820px){.fab{bottom:76px;right:12px;width:54px;height:54px}}
.chat{position:fixed;right:18px;bottom:92px;z-index:81;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 120px));background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,.28);display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
@media (max-width:820px){.chat{right:12px;bottom:138px;height:min(560px,calc(100vh - 160px))}}
.chat header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-dark);color:var(--on-dark)}
.chat header .av{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:18px}
.chat header .xs{color:var(--on-dark-mut)}
.chat header button{margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:var(--r-pill);padding:6px 11px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.bot{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:4px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.2}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line)}
.chips button{flex:none;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:var(--r-pill);padding:6px 12px;font-size:var(--fs-sm);font-weight:600}
.chat form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat form input{flex:1;font:inherit;padding:10px 14px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--bg);color:var(--ink);min-width:0}

/* ---------- mapa, dvojča ---------- */
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,var(--tint-cool),var(--bg));border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:auto}
.house{cursor:pointer}
.house:focus{outline:none}.house:focus-visible .hl{stroke:var(--brand2);stroke-width:3}
.house.sel .hl{stroke:var(--ink);stroke-width:2.5}
.twin svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.drag{cursor:grab}.drag:active{cursor:grabbing}
.drag:focus{outline:none}.drag:focus-visible circle,.drag:focus-visible ellipse{stroke:var(--brand2);stroke-width:3}

/* ---------- nápady ---------- */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.idea{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;color:var(--ink);box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.idea:hover{transform:translateY(-3px);border-color:var(--brand)}
.idea .ico{width:46px;height:46px;border-radius:14px;background:var(--tint-warm);display:grid;place-items:center;color:var(--brand)}
.idea .ico .icon{width:24px;height:24px}
.idea .go{color:var(--brand-ink);margin-top:auto}
.ihead{background:var(--tint-warm);border:1px solid var(--line)}
.ihead .ico{width:60px;height:60px;border-radius:18px;background:var(--card);display:grid;place-items:center;color:var(--brand);flex:none}
.ihead .ico .icon{width:30px;height:30px}
.gains{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.gains{grid-template-columns:minmax(0,1fr)}}
.gains>*{margin-top:0!important}
.gains ul{margin:8px 0 0 18px;padding:0}.gains li{margin:4px 0}
.cert{border-radius:var(--r-lg);padding:24px;color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--green) 55%,#000),var(--green) 60%,var(--yellow));position:relative;overflow:hidden}
.cert .lv{font-size:var(--fs-sm);font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.cert .pc{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em}
.qrbox{background:#fff;border-radius:14px;padding:10px;display:inline-block}
.qrbox svg{display:block;width:150px;height:150px}
#sticker svg{width:100%;height:auto;display:block}
.coin{animation:drop .7s ease-out both}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.fly{animation:fly 1.1s ease-in-out both}
@keyframes fly{from{transform:translate(-210px,40px);opacity:1}to{transform:none;opacity:1}}
.lit{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.45}}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:4px}
.ag{display:flex;gap:10px;align-items:flex-start}
.ag .who{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#fff;font-weight:800}
.ag .bub{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;flex:1;min-width:0}
.ag.cx .bub{opacity:.5;text-decoration:line-through}
.more{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.more .gridm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.more .gridm button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:var(--fs-sm)}
.more .gridm .icon{color:var(--brand)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- odznaky (Odmeny → Odznaky) ---------- */
.bdg-stage{text-align:center;padding-bottom:30px}
.bdg-stage:before{left:50%;right:auto;top:-300px;transform:translateX(-50%);width:640px;height:640px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%)}
.bdg-stage>.row{text-align:left}
.bdg-show{display:flex;align-items:center;justify-content:center;gap:clamp(12px,6vw,60px);margin-top:6px}
.bdg-big{position:relative;border:0;background:none;padding:0 0 26px;width:clamp(150px,22vw,210px);display:block;cursor:pointer}
.bdg-big svg{position:relative;z-index:1;width:100%;height:auto;display:block;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:bdgfloat 4s ease-in-out infinite}
.bdg-big.locked svg{filter:grayscale(1) opacity(.45);animation:none}
.bdg-pedestal{position:absolute;left:8%;right:8%;bottom:0;height:30px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.22),rgba(255,255,255,.04) 60%,transparent 72%);box-shadow:0 10px 22px rgba(0,0,0,.45) inset}
@keyframes bdgfloat{50%{transform:translateY(-6px)}}
.bdg-cap h2{color:#fff;font-size:clamp(22px,2.6vw,30px);margin-top:12px}
.bdg-cap p{color:var(--on-dark);margin-top:4px}
.bdg-cap p.sm{color:var(--on-dark-mut)}
.bdg-x{display:inline-block;font-size:.6em;vertical-align:middle;background:rgba(255,255,255,.14);border-radius:var(--r-pill);padding:2px 10px;margin-left:4px}
.bdg-group{border:0;padding:0;margin-top:14px}
.bdg-group+.bdg-group{border-top:1px solid var(--line);padding-top:6px}
.bdg-group summary{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;list-style:none;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.bdg-group summary::-webkit-details-marker{display:none}
.bdg-group summary>span:last-child{text-transform:none;letter-spacing:0;font-weight:600}
.bdg-group summary:after{content:'';width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translateY(-3px);transition:transform .2s;margin-right:4px}
.bdg-group:not([open]) summary:after{transform:rotate(-45deg)}
.bdg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:12px}
.bdg-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px 10px 12px;color:var(--ink);transition:transform .15s,border-color .15s}
.bdg-item:hover{transform:translateY(-3px);border-color:var(--line-2)}
.bdg-item b{font-size:var(--fs-sm);line-height:1.25}
.bdg-ico{display:block;width:92px}
.bdg-ico svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 8px rgba(30,27,34,.22))}
.bdg-item.locked .bdg-ico svg,.bdg-tiers .locked .bdg-ico svg{filter:grayscale(1) opacity(.42)}
.bdg-item.fresh{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow-t)}
.bdg-prog{width:100%;display:flex;flex-direction:column;gap:3px;align-items:center}
.bdg-prog .bar{width:100%;height:7px}
.bdg-mini{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.bdg-mini-i{border:0;background:none;padding:0;width:48px}
.bdg-mini-i svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 4px rgba(30,27,34,.25))}
.bdg-modal{padding:0;overflow:hidden;max-width:480px}
.bdg-mstage{background:var(--surface-dark);color:var(--on-dark);text-align:center;padding:22px 20px 20px;position:relative;overflow:hidden}
.bdg-mstage:before{content:'';position:absolute;left:50%;top:-220px;transform:translateX(-50%);width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%);pointer-events:none}
.bdg-mstage>*{position:relative}
.bdg-mstage .kicker{color:var(--accent-dark)}
.bdg-mstage .bdg-big{margin:6px auto 0;cursor:default}
.bdg-mstage h2{color:#fff;margin-top:10px}
.bdg-mstage p{color:var(--on-dark-mut);margin-top:4px}
.bdg-x-btn{position:absolute!important;top:12px;right:12px;z-index:2}
.bdg-rays{position:absolute!important;left:50%;top:150px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent-dark) 30%,transparent) 0deg 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:bdgspin 18s linear infinite}
@keyframes bdgspin{to{transform:rotate(360deg)}}
.bdg-mstage.new .bdg-big svg{animation:bdgpop .7s cubic-bezier(.2,1.6,.4,1) both,bdgfloat 4s ease-in-out .7s infinite}
@keyframes bdgpop{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:none;opacity:1}}
.bdg-tiers{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.bdg-tiers>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.bdg-tiers .bdg-ico{width:64px}

/* ---------- lišta priebehu dňa ---------- */
.sim-row{display:flex;align-items:center;gap:12px}
.sim-row input[type=range]{flex:1;min-width:120px}
.sim-t{min-width:46px;text-align:right;font-size:var(--fs-lg)}
@media (max-width:820px){.sim{border-radius:var(--r-lg)}.sim-row{flex-wrap:wrap}.sim-row input[type=range]{order:9;flex-basis:100%}}

/* ---------- výzva dňa (ako .lp-challenge, svetlá) ---------- */
.chal{background:var(--tint-warm);border-color:transparent}
.chal h3{font-size:22px;letter-spacing:-.03em;margin:14px 0 8px}
.chal.cons{background:var(--tint-green)}

/* ---------- mapa v tmavom páse (ako hero na úvode) ---------- */
.map-hero{padding:26px 30px 22px}
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.map-head h1{font-size:clamp(24px,2.6vw,34px)}
.map-head .lead{margin-top:12px}
.map-svg{margin:18px -12px 0}
.map-svg svg{display:block;width:100%;height:auto;overflow:visible}
.map-legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.map-legend span{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:var(--r-pill);background:rgba(255,255,255,.07);border:1px solid var(--line-dark);font-size:var(--fs-xs);font-weight:700;color:var(--on-dark)}
.map-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.map-legend .dash{border-style:dashed;border-color:rgba(255,255,255,.4)}
.mhouse .hl{transition:stroke .15s}
.mhouse:hover .hl{stroke:rgba(255,255,255,.35)}
.map-hero .house.sel .hl{stroke:#fff;stroke-width:2;stroke-dasharray:none}
.map-hero .house:focus-visible .hl{stroke:var(--brand2);stroke-width:2.5}
@media (max-width:820px){.map-hero{padding:26px 16px 20px}.map-svg{margin:12px -8px 0}}

/* ---------- nápady v jazyku úvodu ---------- */
.hero .hstat .sm,.hero .hstat .mut,.hero .hstat p{color:var(--mut)}
.ihero-ico{width:150px;height:150px;border-radius:40px;background:rgba(255,255,255,.08);border:1px solid var(--line-dark);display:grid;place-items:center;color:var(--accent-dark);transform:rotate(-6deg)}
.ihero-ico .icon{width:72px;height:72px;stroke-width:1.3}
.idea{border-radius:var(--r-lg);padding:24px;box-shadow:none}
.idea .ico{background:var(--tint-warm)}
.idea.q{background:var(--bg);border-style:dashed}
@media (max-width:1000px){.ihero-ico{display:none}}
.q-mark{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--orange-t);color:var(--orange);font-size:10px;font-weight:800;margin-left:4px;vertical-align:1px}

/* ---------- mobil ---------- */
@media (max-width:820px){
 .hero-scene{margin:4px 0 0;max-width:none}
 .hero-scene>svg{display:none}
 .hero .hero-scene .lp-float{position:static;transform:none;display:block;margin-top:10px;box-shadow:none}
 .hstat{flex:1 1 130px!important;padding:12px 14px}.hstat b{font-size:20px}
 .hero-aside{gap:10px}
 .kpi .v{font-size:22px}
 .hero h1{font-size:clamp(24px,7vw,30px)}
 .map-legend span{padding:4px 10px}
}

/* =====================================================================
   Iterácia 3 – kompaktný hero, režim poroty, zvonček, prehrávač dňa,
   uvítacia hláška, malé karty ponúk, faktúra, tlač
   ===================================================================== */
.hero.compact{padding:20px 28px}
.hero.compact h1{font-size:clamp(22px,2.2vw,28px)}
.hero.compact .hero-status{margin-bottom:10px}
.hero.compact .hero-acts{margin-top:12px}
.hero.compact .hero-tabs{margin-top:14px}
.hero-foot{margin-top:18px;padding-top:12px}

/* režim poroty */
.side{display:flex;flex-direction:column}
@media (max-width:820px){.side{display:none}}
.side-foot{margin-top:auto;padding-top:18px}
.jury-btn{border:1px dashed var(--line-2)!important;color:var(--mut)!important;font-size:var(--fs-sm)!important;justify-content:center}
.jury-btn[aria-pressed=true]{border-style:solid!important;color:var(--brand-ink)!important;background:var(--brand-t)!important}
.jury-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:var(--r-pill);background:var(--brand-t);color:var(--brand-ink);font-size:var(--fs-xs);font-weight:800;white-space:nowrap}
.jury-tag button{border:0;background:var(--card);color:var(--brand-ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:11px;padding:0}

/* zvonček */
.bell{position:relative;padding:7px 10px!important}
.bell .icon{width:19px;height:19px}
.bell-n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.bell-bg{background:rgba(20,18,26,.18);align-items:flex-start;justify-content:flex-end;padding:72px 24px 24px}
.bellpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:min(400px,100%);max-height:calc(100vh - 110px);overflow:auto;padding:16px}
.notes{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.note{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:var(--r);padding:10px;color:var(--ink);width:100%}
.note:hover{background:var(--bg)}
.note.unread{background:var(--tint-warm)}
.note-ic{width:34px;height:34px;flex:none;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--brand)}
.note-ic .icon{width:17px;height:17px}
.note-b{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;font-size:var(--fs-sm)}
.note-b span{color:var(--mut)}
.note-b .note-t{font-size:var(--fs-xs)}
.note-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
@media (max-width:820px){.bell-bg{align-items:flex-end;padding:0}.bellpanel{width:100%;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:80vh}}

/* Domov: widget „Práve teraz“ a karta „Váš deň“ */
.now{background:var(--bg);color:var(--ink);border-radius:var(--r);padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.22);width:100%;max-width:300px}
.now .tag{display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.08em;font-size:var(--fs-xs);font-weight:800;color:var(--mut)}
.now .tag i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 50%,transparent);animation:livep 1.8s infinite}
@keyframes livep{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.now .ic{font-size:26px;line-height:1}
.now p{font-size:var(--fs-md);font-weight:700;margin-top:8px;line-height:1.35}
.now p b{color:var(--ink);font-size:20px}
.now .xs{color:var(--mut);margin-top:6px;display:block}
.day-card{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center}
.day-card .story{font-size:var(--fs-lg);line-height:1.55}
.day-card .story b{color:var(--ink)}
.day-spark{width:100%;height:auto;display:block}
.hlegend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--mut);margin-top:12px}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend i{width:12px;height:12px;border-radius:4px;display:inline-block}
@media (max-width:820px){.day-card{grid-template-columns:minmax(0,1fr)}}

/* prehrávač dňa */
.modal.player{max-width:980px;padding:24px}
.pl-chart svg{display:block;width:100%;height:auto}
.pl-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.pl-ctrl input[type=range]{flex:1;min-width:140px}
.pl-now{font-size:var(--fs-lg);font-weight:800;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.pl-cap{margin-top:14px;padding:14px 16px;border-radius:var(--r);background:var(--tint-warm);display:flex;gap:12px;align-items:flex-start;min-height:62px}
.pl-cap .num{width:28px;height:28px;flex:none;border-radius:50%;background:var(--surface-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:var(--fs-sm)}
.pl-cap p{font-size:var(--fs-md);line-height:1.5}
.pl-steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:12px 0 0;padding:0;list-style:none}
.pl-steps li{display:flex;gap:8px;font-size:var(--fs-sm);color:var(--mut);padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);opacity:.45;transition:opacity .2s}
.pl-steps li.on{opacity:1;color:var(--ink);background:var(--card)}
.pl-steps li b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface-dark);color:#fff;display:grid;place-items:center;font-size:11px}

/* uvítacia hláška – slniečko */
.modal.welcome{max-width:440px;text-align:center;background:linear-gradient(180deg,var(--sun-bg),var(--card) 55%);position:relative;padding:22px 26px 24px}
.welcome .wl-x{position:absolute;top:12px;right:12px}
.wl-sun{width:170px;margin:0 auto -4px}
.wl-sun svg{width:100%;height:auto;display:block}
.wl-rays{transform-origin:100px 100px;animation:wlspin 24s linear infinite}
@keyframes wlspin{to{transform:rotate(360deg)}}
.welcome h2{font-size:28px;letter-spacing:-.04em;margin-top:2px}
.welcome .kicker{margin-bottom:6px}
.wl-lead{font-size:var(--fs-lg);margin:10px 0 6px;line-height:1.5}
.wl-next{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:16px 0;font-size:var(--fs-sm)}
.wl-tag{flex:none;background:var(--yellow-t);color:var(--yellow-ink);font-weight:800;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:var(--r-pill)}

/* Trhovisko – malé karty ponúk */
.offers{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ocard{border-radius:var(--r);padding:14px 16px;gap:8px;transition:border-color .15s,box-shadow .15s}
.ocard:hover{border-color:var(--line-2);box-shadow:var(--sh)}
.ocard.best{border:1px solid var(--green);box-shadow:0 0 0 3px var(--green-t)}
.ocard-top{display:flex;align-items:center;gap:10px}
.ocard-ic{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--yellow-t);color:var(--yellow-ink)}
.ocard.eve .ocard-ic{background:var(--purple-t);color:var(--purple)}
.ocard.dem .ocard-ic{background:var(--blue-t);color:var(--blue)}
.ocard-ic .icon{width:18px;height:18px}
.ocard-top b{font-size:var(--fs-md);line-height:1.25;flex:1;min-width:0}
.ocard-ok{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--green-t);color:var(--green)}
.ocard-ok.no{background:var(--red-t);color:var(--red)}
.ocard-mid{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ocard-price{font-size:22px;font-weight:800;letter-spacing:-.04em}
.ocard-price small{font-size:var(--fs-xs);font-weight:600;color:var(--mut);letter-spacing:0;margin-left:2px}
.ocard-pct{font-size:var(--fs-xs);font-weight:800;color:var(--green)}
.ocard.eve .ocard-pct{color:var(--purple)}
.ocard-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ocard-bar i{display:block;height:100%;background:var(--green)}
.ocard.eve .ocard-bar i{background:var(--purple)}
.ocard-acts{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:var(--fs-sm);color:var(--mut)}
.ocard-acts .btn{margin-right:auto}
.ocard-acts .link{font-size:var(--fs-xs);color:var(--mut)}
.ocard-acts .link[aria-pressed=true]{color:var(--brand-ink)}
.ocard .priv{font-size:var(--fs-xs);color:var(--mut)}
@media (max-width:820px){.offers{grid-template-columns:minmax(0,1fr);gap:10px}}
/* malé karty skupín */
.groups{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gcard{border-radius:var(--r);padding:16px;gap:8px}
.gcard h3{font-size:var(--fs-h3)}
.gcard .bar{height:6px}

/* mapa – zvýraznenie z legendy */
.map-legend button{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:var(--r-pill);background:rgba(255,255,255,.07);border:1px solid var(--line-dark);font-size:var(--fs-xs);font-weight:700;color:var(--on-dark);transition:background .2s,color .2s}
.map-legend button:hover{background:rgba(255,255,255,.14)}
.map-legend button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.map-legend button.dash{border-style:dashed;border-color:rgba(255,255,255,.4)}
.map-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.map-note{text-align:center;font-size:var(--fs-sm);color:var(--on-dark);margin-top:10px;min-height:20px}
.reg-g,.mhouse,.mfl{transition:opacity .2s,filter .2s}
.reg-g.dim,.mhouse.dim{opacity:.32}
.mfl.dim{opacity:.15}
.reg-g.hi{filter:brightness(1.35) drop-shadow(0 0 10px rgba(255,255,255,.35))}
.mfl.hi path.fl{stroke-width:5px}
.mhouse.hi .hl{stroke:#fff;stroke-width:2.5;stroke-dasharray:none}

/* vyúčtovanie (faktúra) */
.invoice{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:36px 40px;max-width:820px;margin:0 auto;box-shadow:var(--sh-lg);position:relative}
.inv-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:16px}
.inv-head img{height:36px;border-radius:6px}
.inv-stamp{position:absolute;top:28px;right:50%;transform:translateX(50%) rotate(-6deg);border:2px solid var(--red);color:var(--red);font-weight:800;font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:6px;opacity:.85}
.inv-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0;font-size:var(--fs-sm)}
.inv-meta span{display:block;color:var(--mut);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.invoice table td,.invoice table th{padding:10px 8px}
.inv-total td{font-size:var(--fs-lg);font-weight:800;border-bottom:0;border-top:2px solid var(--ink)}
.inv-save{margin-top:16px;padding:14px 16px;border-radius:var(--r);background:var(--green-t);color:var(--green);font-weight:700}
.inv-note{margin-top:18px;font-size:var(--fs-xs);color:var(--mut);line-height:1.6}
@media (max-width:820px){.invoice{padding:22px 18px}.inv-meta{grid-template-columns:minmax(0,1fr)}.inv-stamp{position:static;transform:none;display:inline-block;margin-bottom:10px}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .top,.side,.bnav,.fab,.chat,.toast,.cap,.drawer,#modal,.no-print{display:none!important}
  .main{padding:0!important;max-width:none}
  .shell{display:block}
  .invoice{box-shadow:none;border:0;padding:0;max-width:none}
  .print-only{display:block!important}
}
.print-only{display:none}
@media (prefers-reduced-motion:reduce){.wl-rays,.now .tag i{animation:none}}
@media print{#main .gap>*:not(.inv-wrap){display:none!important}}
/* Váš potenciál */
.ben .col.hl{box-shadow:0 0 0 3px var(--brand-t),var(--sh-lg);border-color:var(--brand)}
.pot-bar .bar{margin-top:6px}
.ihero .lead{-webkit-line-clamp:4}
.grid.at{align-items:start}

/* ---------- registrácia, krok 2: overenie, porovnanie skupín, časová os ---------- */
.regsteps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.regsteps li{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:700;color:var(--on-dark-mut);padding:6px 12px 6px 6px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);border:1px solid var(--line-dark)}
.regsteps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-xs);border:1.5px solid var(--line-dark)}
.regsteps li.is-done{color:var(--on-dark)}.regsteps li.is-done span{background:var(--on-dark-ok);border-color:var(--on-dark-ok);color:var(--surface-dark-2)}
.regsteps li.is-now{color:var(--surface-dark-2);background:var(--card);border-color:var(--card)}.regsteps li.is-now span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.vf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px;margin-top:10px}
.vf{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.vf-i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:800;background:var(--green-t);color:var(--green)}
.vf.no .vf-i{background:var(--red-t);color:var(--red)}.vf.warn .vf-i{background:var(--orange-t);color:var(--orange)}
.vf .link{font-size:var(--fs-xs)}
.todo{margin:10px 0 0;padding:0;list-style:none;counter-reset:td;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.todo li{counter-increment:td;background:var(--tint-warm);border-radius:var(--r);padding:14px 16px 14px 52px;position:relative;font-size:var(--fs-sm);line-height:1.5}
.todo li::before{content:counter(td);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:var(--fs-sm)}
.todo li b{display:block;color:var(--ink)}
div.todo{display:block;background:var(--green-t);border-radius:var(--r);padding:14px 16px;font-size:var(--fs-sm)}
.gcmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gcmp-card{display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;background:var(--card);cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.gcmp-card:hover{border-color:var(--line-2)}
.gcmp-card.on{border:2px solid var(--brand);box-shadow:0 0 0 4px var(--brand-t)}

.lp-reg h1{max-width:none}
.lp-reg-choose{padding-top:56px}
.lp-reg-choose .lp-path{min-height:340px}
.lp-reg-choose .logos{margin-top:24px}
.lp-reg-demo{margin-top:16px;gap:10px}

/* ---------- nočný štýl úvodu: polárna žiara, hviezdy, sklenené karty, žiariaca scéna ---------- */
.marketing .top{background:var(--surface-dark);border-color:var(--line-dark)}
.marketing .brand{color:var(--on-dark)}
.marketing .market-nav a{color:var(--on-dark-mut)}
.marketing .market-nav a:hover{color:var(--on-dark)}
.marketing .top .btn:not(.dark){color:var(--on-dark);border-color:var(--line-dark)}
.lp-hero:before{width:auto;height:auto;border-radius:0;inset:-25% -10% -5% 30%;
  background:radial-gradient(26% 72% at 58% 26%,color-mix(in srgb,var(--aurora-1) 62%,transparent),transparent 70%),
    radial-gradient(20% 80% at 74% 18%,color-mix(in srgb,var(--aurora-1) 48%,transparent),transparent 72%),
    radial-gradient(28% 75% at 93% 26%,color-mix(in srgb,var(--aurora-2) 66%,transparent),transparent 72%),
    radial-gradient(22% 46% at 44% 8%,color-mix(in srgb,var(--aurora-3) 42%,transparent),transparent 70%);
  filter:blur(22px);animation:lp-aurora 16s ease-in-out infinite alternate}
.lp-hero:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,var(--on-dark) 50%,transparent 52%),radial-gradient(1px 1px at 28% 8%,var(--on-dark) 50%,transparent 52%),
    radial-gradient(1.4px 1.4px at 46% 22%,var(--on-dark) 50%,transparent 52%),radial-gradient(1px 1px at 58% 6%,var(--on-dark) 50%,transparent 52%),
    radial-gradient(1.3px 1.3px at 72% 14%,var(--on-dark) 50%,transparent 52%),radial-gradient(1px 1px at 84% 30%,var(--on-dark) 50%,transparent 52%),
    radial-gradient(1.2px 1.2px at 93% 9%,var(--on-dark) 50%,transparent 52%),radial-gradient(1px 1px at 66% 40%,var(--on-dark) 50%,transparent 52%),
    radial-gradient(1px 1px at 38% 4%,var(--on-dark) 50%,transparent 52%),radial-gradient(1.2px 1.2px at 78% 52%,var(--on-dark) 50%,transparent 52%)}
.lp-hero .lp-wrap{position:relative;z-index:1}
@keyframes lp-aurora{from{transform:translateX(0) skewX(0deg)}to{transform:translateX(-5%) skewX(-7deg)}}
.lp-hero .lp-float{background:var(--night-glass);color:var(--on-dark);border:1px solid color-mix(in srgb,var(--accent-dark) 55%,transparent);backdrop-filter:blur(10px);
  box-shadow:0 0 26px color-mix(in srgb,var(--accent-dark) 22%,transparent),0 14px 50px rgba(0,0,0,.35)}
.lp-hero .lp-float .tag,.lp-hero .lp-live{color:var(--on-dark-mut)}
.lp-hero .lp-float .positive{color:var(--accent-dark)}
.lp-hero .lp-live i{background:var(--accent-dark);box-shadow:0 0 8px var(--accent-dark)}
.lp-hero-checks{gap:14px 26px;font-size:var(--fs-md)}
.lp-hero-checks>span{gap:12px}
.lp-chk-dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--accent-dark);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-dark) 18%,transparent),0 0 12px var(--accent-dark)}
@media(prefers-reduced-motion:reduce){.lp-hero:before{animation:none}}
.lp-aurora{position:absolute;top:0;right:0;width:70%;height:100%;pointer-events:none;opacity:.9;transform-origin:top center;animation:lp-curtain 18s ease-in-out infinite alternate}
@keyframes lp-curtain{from{transform:skewX(0deg) scaleY(1)}to{transform:skewX(-6deg) scaleY(1.04) translateX(-3%)}}
.lp-hero:before{opacity:.45}
.lp-float-ic{position:absolute;right:16px;top:16px;width:22px;height:22px;color:var(--accent-dark)}
.lp-float.one{padding-right:52px}.lp-float.two{padding-right:48px}
@media(prefers-reduced-motion:reduce){.lp-aurora{animation:none}}
@media(max-width:900px){.lp-aurora{width:100%;opacity:.6}}

/* ---------- hero: celé pozadie je obrázok scény (hero-bg.jpg v priečinku assets, 1659 × 948) ----------
   Ľavá časť obrázka je tmavá – je pod textom. Živé karty z enginu sa vznášajú nad scénou. */
.lp-hero.bg{background-color:var(--surface-dark);background-position:100% 0;background-size:cover;background-repeat:no-repeat}
.lp-hero.bg:before{display:none}
.lp-scene.bg-cards .lp-float{border:1.5px solid color-mix(in srgb,var(--accent-dark) 80%,transparent);
  box-shadow:0 0 22px color-mix(in srgb,var(--accent-dark) 35%,transparent),inset 0 0 18px color-mix(in srgb,var(--accent-dark) 10%,transparent),0 14px 40px rgba(0,0,0,.35);padding-right:52px}
.lp-scene.bg-cards .lp-float.one{transform:rotate(3deg)}
.lp-scene.bg-cards .lp-float.two{transform:rotate(-3.5deg)}
.lp-scene.bg-cards .lp-float-ic{top:50%;margin-top:-11px}
@media(min-width:821px){
 .lp-hero.bg{min-height:max(620px,calc(100vw*948/1659));margin-top:-65px;padding-top:137px}
 .lp-hero.bg .lp-wrap,.lp-hero.bg .lp-hero-grid{position:static}
 .lp-hero.bg .lp-hero-grid>div:first-child{position:relative;z-index:2}
 .lp-scene.bg-cards{position:absolute;inset:0;margin:0;max-width:none;pointer-events:none}
 .lp-scene.bg-cards .lp-float.one{top:22%;right:4%;left:auto}
 .lp-scene.bg-cards .lp-float.two{top:64%;left:50%;bottom:auto}
 /* priesvitná lišta – obloha pokračuje až pod ňu */
 .marketing:has(.lp-hero.bg) .top{background:color-mix(in srgb,var(--surface-dark) 38%,transparent);border-color:color-mix(in srgb,var(--on-dark) 8%,transparent)}
}
@media(max-width:820px){
 .lp-hero.bg{background-size:auto 112vw;background-position:78% 100%;padding-bottom:0}
 .lp-scene.bg-cards{min-height:100vw;margin-top:12px}
 .lp-hero.bg:before{display:block;content:'';inset:auto 0 auto 0;top:calc(100% - 112vw);width:auto;height:34vw;border-radius:0;filter:none;opacity:1;animation:none;background:linear-gradient(to bottom,var(--surface-dark),transparent)}
 .lp-scene.bg-cards .lp-float.one{top:0;right:0}
 .lp-scene.bg-cards .lp-float.two{bottom:2%;left:0}
}
/* po scrollovaní je lišta plná (nie priesvitná) s tieňom – čitateľná nad svetlými sekciami */
.marketing .top{transition:background-color .2s ease,box-shadow .2s ease,border-color .2s ease}
body.marketing.scrolled .top,body.marketing.scrolled:has(.lp-hero.bg) .top{background:var(--surface-dark);border-color:var(--line-dark);box-shadow:0 6px 24px rgba(0,0,0,.28)}
@media(prefers-reduced-motion:reduce){.marketing .top{transition:none}}
/* odkazy v hornej lište: začiatok sekcie sedí presne pod spodnou hranou prilepenej lišty */
.lp [id]{scroll-margin-top:65px}
@media(max-width:820px){.lp [id]{scroll-margin-top:56px}}

</style>

const LOGO_APP='assets/zdielna-dot.svg';
/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const T2I=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');if(!m)return 0;return Math.max(0,Math.min(96,Math.round((+m[1]*60+ +m[2])/15)))};
const I2T=i=>{const m=Math.max(0,Math.min(96,i))*15;return pad(Math.floor(m/60))+':'+pad(m%60)};
const fm=(n,d=2)=>Number(n||0).toLocaleString('sk-SK',{minimumFractionDigits:d,maximumFractionDigits:d});
const fpr=n=>Number(n||0).toLocaleString('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:3});
const eur=n=>fm(n,2)+' €';
const eur0=n=>fm(n,0)+' €';
const pct=n=>Math.round((n||0)*100)+' %';
const sum=a=>a.reduce((s,x)=>s+x,0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const getPath=(k)=>k.split('.').reduce((o,p)=>o&&o[p],S);
const setPath=(k,v)=>{const a=k.split('.');const l=a.pop();a.reduce((o,p)=>o[p],S)[l]=v};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const inWin=(i,a,b)=>a<=b?(i>=a&&i<b):(i>=a||i<b);
const BR=()=>SKN[S.skin]||'ZSE';
const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};

   Vypnuté obrazovky sa nezobrazia a tlačidlá, ktoré na ne vedú, sa skryjú (gateActs v main.js). */
const ON=new Set(['landing','register']);

function runDay(appT,o={}){

function mono(pts){
  const n=pts.length;if(n<2)return '';
  const dx=[],m=[];
  for(let i=0;i<n-1;i++){dx.push(pts[i+1][0]-pts[i][0]);m.push((pts[i+1][1]-pts[i][1])/dx[i])}
  const t=[m[0]];
  for(let i=1;i<n-1;i++)t.push(m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2);
  t.push(m[n-2]);
  for(let i=0;i<n-1;i++){
    if(m[i]===0){t[i]=0;t[i+1]=0;continue}
    const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;
    if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}
  }
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+t[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-t[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`}
  return d;
}

function flowTick(t){

    if(sold>.005){ic='☀';txt=`Vaša strecha teraz posiela susedom <b>${fm(sold,2)} kWh</b>`}
    else if(bat>.005){ic='🔋';txt=`Batéria teraz predáva susedom <b>${fm(bat,2)} kWh</b>`}
    else if(S.bat.on){ic='🔋';txt=`Batéria je nabitá na <b>${pct(soc)}</b> – ${cur<T2I(S.bat.eStart)?'večer ju predáte susedom':'čaká na zajtrajšie slnko'}`}
    else txt=`Strecha teraz oddychuje – ${nextSun||'dnes už bez slnka'}`;
  }
  return `<div class="now" role="status" aria-live="polite"><span class="tag"><i aria-hidden="true"></i>Práve teraz · ${t}</span><p><span class="ic" aria-hidden="true">${ic}</span> ${txt}</p><span class="xs">${S.jury?'čas dema':'podľa hodín'} · aktualizuje sa každých 15 minút</span></div>`;
}
/* malý náhľad dňa (bez osí) – iba ako pozvánka do prehrávača */
function daySpark(res,per){
  const lo=24,hi=92,W=260,H=90,aa=res.A.a.map(v=>v*res.share),sh=new Array(96).fill(0);
  for(const r of res.recs)if(!r.kind&&(r.from===per||r.to===per))sh[r.i]+=r.kwh;
  const base=per==='peter'?res.A.c:aa,mx=Math.max(.2,...base.slice(lo,hi),...aa.slice(lo,hi));
  const pt=(a,i)=>[(i-lo)/(hi-lo)*W,H-4-(a[i]/mx)*(H-12)];
  const line=a=>{const p=[];for(let i=lo;i<hi;i++)p.push(pt(a,i));return mono(p)};
  const area=a=>line(a)+`L${W},${H-4}L0,${H-4}Z`;
  return `<svg class="day-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${area(aa)}" fill="var(--yellow)" opacity=".18"/><path d="${area(sh)}" fill="var(--green)" opacity=".45"/>${per==='peter'?`<path d="${line(res.A.c)}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>`:''}<path d="${line(aa)}" fill="none" stroke="var(--yellow)" stroke-width="1.6"/><line x1="0" x2="${W}" y1="${H-4}" y2="${H-4}" stroke="var(--line)"/></svg>`;
}

function heat(){

  days.forEach((d,di)=>{const r=runDay(S.c.appTime,{mul:mul[di]});h+=`<div class="mut">${d}</div>`;blocks.forEach(b=>{let off=0,sh=0;for(let i=b;i<b+8;i++)off+=r.R.offer[i];for(const x of r.recs)if(x.from==='anna'&&!x.kind&&x.src!=='bat'&&x.i>=b&&x.i<b+8)sh+=x.kwh;const u=off>0.01?sh/off:0;const c=u>.7?'h3':u>.4?'h2':u>.05?'h1':'h0';h+=`<div class="${c}" title="${fm(u*100,0)} %">${off>0.01?fm(u*100,0)+'%':'–'}</div>`})});

}

 <span class="kicker">Zdieľňa · zdieľanie elektriny</span>
 <h1 id="lp-heading">Zelená energia je ešte lepšia, <em>keď sa zdieľa<span class="sig">.</span></em></h1>
 <p class="lp-intro">Máte elektrinu navyše? Podeľte sa o ňu a získajte viac. Nemáte vlastné panely? Využite slnečnú energiu od susedov.</p>
 <button class="lp-quick" type="button" data-act="view:register"><span class="lp-quick-q">Chcete sa pridať do sveta zdieľania energie?</span><span class="lp-quick-btn">Pridať sa <span class="lp-quick-arr" aria-hidden="true">→</span></span></button>
 <div class="lp-hero-checks"><span><i class="lp-chk-dot"></i>Energia na autopilota</span><span><i class="lp-chk-dot"></i>Inteligentné párovanie</span><span><i class="lp-chk-dot"></i>Efektívne zdieľanie</span></div>
 </div><div class="lp-scene bg-cards"><div class="lp-float one">${icon('chart','lp-float-ic')}<span class="tag">Keď strecha nezaháľa</span><b>+ ${eur(n.gainMonth)}</b><span class="positive">oproti výkupu za mesiac</span></div><div class="lp-float two">${icon('clock','lp-float-ic')}<div class="lp-live"><i></i> Slnko práve spája</div><b>${n.win}</b><span>Čas na slnečnú elektrinu</span></div></div></div>
 </div></section>
 <div class="lp-wrap"><div class="lp-promises">${[['shield','Vy rozhodujete','Cenu poznáte vopred.'],['home','S panelmi aj bez nich','Svoje miesto si nájde každý.'],['clock','Správna energia, správny čas','Spájame výrobu so spotrebou.'],['chart','Žiadne hádanie','kWh aj eurá v jednom prehľade.']].map(([i,h,p])=>`<div class="lp-promise">${icon(i)}<div><b>${h}</b><small>${p}</small></div></div>`).join('')}</div></div>
 <section class="lp-section" id="lp-benefits"><div class="lp-wrap"><div class="lp-section-head"><div><span class="kicker">Dve strany. Jedna dobrá myšlienka.</span><h2>Zo slnka môže mať viac každý<span class="sig">.</span></h2></div></div><div class="lp-paths">
 <article class="lp-path consumer"><span class="kicker">Mám spotrebu</span><h3>Na slnečnú elektrinu nepotrebujete strechu.</h3><p>Vyberte si elektrinu od ľudí, ktorí jej majú navyše. Najväčší zmysel dáva vtedy, keď ju práve využijete.</p><ul><li>Výhodnejšia cena zdieľanej elektriny</li><li>Odporúčanie vhodného času spotreby</li><li>Bez provízie platforme pre odberateľa</li></ul><button class="btn dark lg" data-act="view:register">Nájsť lacnejšiu elektrinu <span aria-hidden="true">→</span></button>${icon('home','path-art')}</article>
 <article class="lp-path"><span class="kicker">Mám výrobu</span><h3>Nech vaša strecha pracuje aj pre vás.</h3><p>Dajte prebytkom lepšie využitie. Ponúknite ich za vlastnú cenu a sledujte, čo vám zostane po provízii.</p><ul><li>Vlastná alebo odporúčaná cena</li><li>Odporúčané prepojenia s odberateľmi</li><li>Prebytky môžete aj darovať – škole alebo rodine v núdzi, bez provízie</li></ul><button class="btn dark lg" data-act="view:register">Ponúknuť prebytky <span aria-hidden="true">→</span></button>${icon('sun','path-art')}</article>
 </div></div></section>
 <section class="lp-section lp-how" id="lp-how"><div class="lp-wrap"><div class="lp-how-grid"><div><span class="kicker">Menej vybavovania. Viac energie.</span><h2>Začína sa to jedným klikom<span class="sig">.</span></h2><p class="lead">Nájdeme vám vhodných partnerov na zdieľanie a postaráme sa o prehľad aj vyúčtovanie. Vy máte svoju energiu pod kontrolou.</p></div><div class="lp-step-grid"><article><span class="lp-step-num">01</span><h3>Zaregistrujte sa</h3><p>Prihláste sa účtom ZSE alebo VSE a údaje doplníme za vás. Máte iného dodávateľa? Stačí registrácia s EIC kódom z faktúry.</p></article><article><span class="lp-step-num">02</span><h3>Nájdite svoju zhodu</h3><p>Porovnajte cenu aj čas. Vyberte si ponuku alebo nastavte vlastné prebytky.</p></article><article><span class="lp-step-num">03</span><h3>Zdieľajte a sledujte</h3><p>Po schválení zapojenia uvidíte zdieľané kWh, príjem, úsporu aj zúčtovanie.</p></article></div></div></div></section>
 <div class="lp-wrap" id="lp-club"><section class="lp-club"><div><span class="kicker">Zoznámte sa so Slnečným klubom</span><h2>Dobré návyky. Získate viac<span class="sig">.</span></h2><p class="lead">Zbierajte body za spotrebu v čase prebytkov. Získajte nižšiu províziu, lepšie ponuky a ďalšie výhody alebo body darujte cez Solidárne slnko.</p><button class="btn light lg" data-act="landingfeature:rewards">Objaviť slnečné výzvy →</button></div><div class="lp-challenge"><span class="pill y">+ ${n.pts} bodov · dnešná výzva</span><h3>Dnes perieme so slnkom.</h3><p>Presuňte plánované pranie do okna ${n.win}. Malá zmena pre vás, lepšie využité prebytky pre všetkých.</p><div class="lp-progress" role="img" aria-label="Komunitný cieľ splnený na ${pct(n.goal)}"><span style="width:${(n.goal*100).toFixed(0)}%"></span></div><div class="lp-challenge-bottom"><span>Cieľ skupiny Slnečný kruh 17</span><b>${pct(n.goal)} splnené</b></div>${(l=>`<div class="lp-level"><div class="lp-level-steps" role="img" aria-label="Úroveň ${l.name} z ${LEVELS.length}">${LEVELS.map(([nm],k)=>`<span class="${k<l.i?'done':k===l.i?'cur':''}">${nm}</span>`).join('')}</div><div class="lp-challenge-bottom"><span>Vaša úroveň: <b>${l.name}</b></span><span>${l.next?`${fm(l.need,0)} bodov do úrovne ${l.next}`:'Najvyššia úroveň'}</span></div></div>`)(lvlOf(S.pts.base))}<p class="note">Body pripíšeme po overení elektromerom – za presun spotreby, nikdy za vyššiu spotrebu.</p></div></section></div>
 <section class="lp-section" id="lp-offers"><div class="lp-wrap"><div class="lp-section-head"><div><span class="kicker">Trhovisko plné možností</span><h2>Elektrina, ktorá zapadne do vášho dňa<span class="sig">.</span></h2></div><p class="lead">Vyberte si elektrinu od susedov za nižšiu cenu, ako platíte dodávateľovi. Spotrebujte ju vtedy, keď je jej najviac.</p></div><div class="lp-offers">${offers.map(([h,p,price,time,tag,i,save,who,cta],idx)=>`<article class="lp-offer"><div class="lp-offer-art"><span class="pill c">${tag}</span>${idx===0?`<svg viewBox="0 0 190 175" aria-hidden="true">${lpHouse()}</svg>`:icon(i)}</div><div class="lp-offer-body"><h3>${h}</h3><p>${p}</p><div class="lp-offer-price">${fm(price,2)} € <span>/ kWh bez DPH</span></div><span class="pill g lp-offer-save">${save}</span><div class="lp-offer-meta"><span>${time}</span><b>${who}</b></div><button class="btn ${idx===2?'out':'dark'} block" data-act="view:register">${cta} <span aria-hidden="true">→</span></button></div></article>`).join('')}</div><p class="note">Ceny sú bez DPH a bez distribučných, regulovaných a fixných poplatkov. Úspora oproti bežnej sadzbe pre domácnosti ${fm(SUPPLY_HH,4)} €/kWh bez DPH. Darovanie závisí od zapojenia oprávneného príjemcu.</p></div></section>
 <section class="lp-section lp-smart"><div class="lp-wrap lp-smart-grid"><div><span class="kicker">Trochu iný čas. Lepší výsledok.</span><h2>Slnko má svoj plán. Vy z neho môžete vyťažiť viac<span class="sig">.</span></h2><p class="lead">Umývačka po obede. Nabíjanie cez deň. Malý posun plánovanej spotreby môže znamenať viac využitej elektriny a väčšiu úsporu.</p><p class="lead">Predikcia ukáže vhodný čas. Vy rozhodnete, čo sa vám hodí.</p><button class="btn dark lg" style="margin-top:24px" data-act="landingfeature:forecast">Vyskúšať posun spotreby →</button></div><div class="lp-chart-card"><div class="row between"><h3>Váš slnečný zajtrajšok</h3><span class="pill c">Ukážka predikcie</span></div><div class="lp-chart-legend"><span><i class="prod"></i> Dostupné prebytky</span><span><i class="cons"></i> Vaša spotreba</span></div><svg viewBox="0 0 430 205" role="img" aria-label="Ilustračný graf: dostupné prebytky vrcholia na poludnie a presun spotreby zvyšuje ich využitie"><path d="M20 40h390M20 90h390M20 140h390M20 175h390" stroke="var(--line)" fill="none"/><rect x="156" y="20" width="120" height="155" fill="var(--yellow-t)" rx="8"/><path d="M20 175C70 175 90 160 123 127S164 43 209 37 262 72 299 118 345 169 410 175Z" fill="var(--c-prod)" fill-opacity=".28"/><path d="M20 175C70 175 90 160 123 127S164 43 209 37 262 72 299 118 345 169 410 175" stroke="var(--c-prod)" stroke-width="3" fill="none"/><path d="M20 149 75 143 120 151 158 95 185 115 217 68 249 104 277 127 318 140 365 147 410 139" stroke="var(--c-cons)" stroke-width="3" fill="none"/><g fill="var(--mut)" font-family="Figtree,sans-serif" font-size="11"><text x="14" y="199">06:00</text><text x="140" y="199">10:00</text><text x="267" y="199">14:00</text><text x="380" y="199">18:00</text></g></svg><div class="lp-chart-result"><b>Vaše slnečné okno: ${n.win}</b>Skúste sem presunúť plánované nabíjanie alebo umývanie riadu.</div><p class="note">Ilustračná predikcia. Skutočná výroba aj spotreba sa môžu líšiť.</p></div></div></section>
