function batCard(compact){
  const B=S.bat;
  if(!B.on)return `<div class="card" style="border-left:5px solid var(--purple)"><div class="row between"><h3>🔋 Domáca batéria</h3>${pill('n','vypnutá')}</div><p class="sm mut" style="margin-top:6px">Ak máte k fotovoltike batériu, cez deň si uložíte časť prebytku a večer ho predáte susedom drahšie ako na obed – stále však lacnejšie, než by platili zo siete.</p><div class="fields one" style="margin-top:8px">${F('Mám batériu','bat.on',{t:'c'})}</div></div>`;
  const res=dayRun(),o=agg(res),a=o.anna,d=S.sim.days,np=netPrice(B.price);
  const carry=Math.max(0,o.socEnd-res.minK);
  let h=`<div class="card" style="border-left:5px solid var(--purple)"><div class="row between"><h3>🔋 Večerná ponuka z batérie</h3><div class="row">${pill('p','🔋 z batérie')}${pill('n',B.eStart+' – '+B.eEnd)}</div></div>
  <p class="sm mut" style="margin-top:4px">Cez deň sa batéria nabíja z prebytku, ktorý si skupina nevzala. Večer ho predáte za <b>${fpr(B.price)} €/kWh</b> (po provízii ${fpr(np)} €) – viac ako obedných ${fpr(S.p.price)} €, menej ako ${fpr(S.c.ref)} € zo siete.</p>
  <div class="grid g4" style="margin-top:10px">${kpi('Nabité dnes',fm(a.batCh,1)+' kWh',`straty ${fm(a.batLoss,2)} kWh`)}${kpi('Predané večer',fm(a.batSold,1)+' kWh',a.batOwn>0?`+ ${fm(a.batOwn,1)} kWh pre vás`:'odberateľom v skupine')}${kpi('Zisk z batérie / deň',(a.batGain>=0?'+':'')+eur(a.batGain),'oproti predaju výkupcovi')}${kpi('Zisk z batérie / rok',(a.batGain>=0?'+':'')+eur0(a.batGain*d*12),'odhad, '+d+' dní × 12')}</div>
  <div style="margin-top:12px">${socChart(res.R.soc,{cap:B.cap,ch:res.R.ch,dis:res.R.dis.map((v,i)=>v+res.R.own[i]),min:res.minK,minLbl:'min. stav nabitia',idx:S.sim.idx,soc0:res.soc0})}</div>
  <p class="xs mut" style="margin-top:6px">Zisk z batérie = večer predané kWh × (večerná cena − provízia)${a.batOwn>0?' + vlastná spotreba × cena zo siete':''} − nabité kWh × výkupná cena (čo by ste za ne dostali bez batérie). Zostatok ${fm(carry,1)} kWh nad minimom sa prenesie do ďalšieho dňa.</p>
  ${batWarnHtml()}`;
  if(!compact)h+=`<h3 style="margin-top:14px">Nastavenie batérie</h3><div class="fields three" style="margin-top:8px">${F('Mám batériu','bat.on',{t:'c'})}${F('Kapacita','bat.cap',{step:.5,min:.5,u:'kWh'})}${F('Max. výkon','bat.pow',{step:.25,min:.25,u:'kWh/15 min'})}${F('Účinnosť nabitia','bat.eff',{step:1,min:50,max:100,u:'%'})}${F('Min. stav nabitia','bat.minSoc',{step:5,max:90,u:'%'})}${F('Ukladať zo zvyšku prebytku','bat.pct',{step:5,max:100,u:'%'})}${F('Večerné okno od','bat.eStart',{t:'t'})}${F('Večerné okno do','bat.eEnd',{t:'t'})}${F('Večerná cena','bat.price',{step:.005,u:'€/kWh'})}${F('Najprv pokryť vlastnú večernú spotrebu','bat.ownFirst',{t:'c'})}${F('Max. cena Petra večer','c.maxEve',{step:.005,u:'€/kWh'})}</div>`;
  else h+=`<div class="row" style="margin-top:10px"><button class="btn sm" data-act="view:group">Nastaviť batériu →</button></div>`;
  return h+`</div>`;
}

<script>

'use strict';

/* stav členstva – pri aktívnom členstve ako štítky v hero, inak samostatná karta */
function memTop(){

/* kontrola jedného 15-min intervalu – pre porotu/operátora (Prehľady → Ledger), nie pre zákazníka */
function intervalCard(res,per){
  return `<div class="card"><div class="row between"><div><h3>Kontrola intervalu – živé úpravy</h3><p class="xs mut">Zmeňte meranie alebo cenu a sledujte prepočet jednej 15-minútovej alokácie.</p></div><button class="btn sm" data-act="drawer">Všetky parametre</button></div>
   <div class="fields" style="margin-top:10px">${F('Interval skutočného merania','meter.idx',{t:'i'})}${F('Skutočný prebytok Anny','meter.anna',{step:.05,u:'kWh'})}${F('Skutočná spotreba Petra','meter.peter',{step:.05,u:'kWh'})}${F('Ponuková cena Anny','p.price',{step:.005,u:'€/kWh'})}${F('Max. cena Petra','c.max',{step:.005,u:'€/kWh'})}${F('Referenčná cena Petra','c.ref',{step:.005,u:'€/kWh'})}${F('Výkupná cena Anny','p.feedin',{step:.005,u:'€/kWh'})}${F('Provízia '+BR(),'fee.fix',{step:.5,u:'€/MWh'})}${F('Večerná cena z batérie','bat.price',{step:.005,u:'€/kWh'})}${F('Max. cena Petra večer','c.maxEve',{step:.005,u:'€/kWh'})}</div>
   ${(()=>{const i=S.meter.idx,rs=res.recs.filter(r=>r.i===i&&r.from==='anna'&&r.to==='peter'),k=sum(rs.map(r=>r.kwh)),am=sum(rs.map(r=>r.amt)),cm=sum(rs.map(r=>r.com));return `<div class="row" style="margin-top:12px;gap:18px"><div><div class="xs mut">Alokované Petrovi ${I2T(i)}–${I2T(i+1)}</div><div class="b upd" style="font-size:19px;color:var(--green)">${fm(k,2)} kWh</div></div><div><div class="xs mut">Nevyužitý prebytok Anny</div><div class="b" style="font-size:19px;color:var(--orange)">${fm(res.R.left[i],2)} kWh</div></div><div><div class="xs mut">Peter zaplatil (tržba Anny)</div><div class="b" style="font-size:19px">${eur(am)}</div></div><div><div class="xs mut">Provízia ${BR()} (od výrobcu)</div><div class="b" style="font-size:19px;color:var(--brand-ink)">${fm(cm,3)} €</div></div><div><div class="xs mut">Anna dostane (čisto)</div><div class="b" style="font-size:19px">${fm(am-cm,3)} €</div></div></div>${S.p.price>S.c.max?`<div class="pill r" style="margin-top:8px">✕ Cena ponuky (${fpr(S.p.price)} €) je vyššia než maximum odberateľa (${fpr(S.c.max)} €) – energia sa nepridelí</div>`:''}${per!=='peter'?priceWarn()+batWarnHtml():''}`})()}</div>`;
}
/* 6a – widget „Práve teraz“: iba aktuálny 15-min interval */
function nowWidget(per,res){
  const cur=Math.min(95,S.sim.idx),P=res.P,w=bestWin(P.fp.map((v,i)=>Math.min(v,P.fc[i]))),t=`${I2T(cur)}–${I2T(cur+1)}`;
  const rs=res.recs.filter(r=>r.i===cur&&!r.kind),nextSun=w?(cur<w.a?`slnečné okno o ${I2T(w.a)}`:`ďalšie slnečné okno zajtra o ${I2T(w.a)}`):'';
  let ic='🌙',txt;
  if(per==='peter'){
    const day=sum(rs.filter(r=>r.to==='peter'&&!r.src).map(r=>r.kwh)),bat=sum(rs.filter(r=>r.to==='peter'&&r.src==='bat').map(r=>r.kwh));
    if(day>.005){ic='☀';txt=`Od suseda vám teraz tečie <b>${fm(day,2)} kWh</b>`}
    else if(bat>.005){ic='🔋';txt=`Teraz vám svieti batéria suseda · <b>${fm(bat,2)} kWh</b>`}
    else txt=`Teraz beriete zo siete – ${nextSun||'dnes už bez slnka'}`;
  }else{
    const sold=sum(rs.filter(r=>r.from==='anna'&&!r.src).map(r=>r.kwh)),bat=sum(rs.filter(r=>r.from==='anna'&&r.src==='bat').map(r=>r.kwh)),soc=S.bat.on?res.R.soc[cur]/Math.max(.1,S.bat.cap):0;
    if(sold>.005){ic='☀';txt=`Vaša strecha teraz posiela susedom <b>${fm(sold,2)} kWh</b>`}
    else if(bat>.005){ic='🔋';txt=`Batéria teraz predáva susedom <b>${fm(bat,2)} kWh</b>`}
    else if(S.bat.on){ic='🔋';txt=`Batéria je nabitá na <b>${pct(soc)}</b> – ${cur<T2I(S.bat.eStart)?'večer ju predáte susedom':'čaká na zajtrajšie slnko'}`}
    else txt=`Strecha teraz oddychuje – ${nextSun||'dnes už bez slnka'}`;
  }
  return `<div class="now" role="status" aria-live="polite"><span class="tag"><i aria-hidden="true"></i>Práve teraz · ${t}</span><p><span class="ic" aria-hidden="true">${ic}</span> ${txt}</p><span class="xs">${S.jury?'čas dema':'podľa hodín'} · aktualizuje sa každých 15 minút</span></div>`;
}
/* malý náhľad dňa (bez osí) – iba ako pozvánka do prehrávača */
function daySpark(res,per){
  const lo=24,hi=92,W=260,H=90,aa=res.A.a.map(v=>v*res.share),sh=new Array(96).fill(0);
  for(const r of res.recs)if(!r.kind&&(r.from===per||r.to===per))sh[r.i]+=r.kwh;
  const base=per==='peter'?res.A.c:aa,mx=Math.max(.2,...base.slice(lo,hi),...aa.slice(lo,hi));
  const pt=(a,i)=>[(i-lo)/(hi-lo)*W,H-4-(a[i]/mx)*(H-12)];
  const line=a=>{const p=[];for(let i=lo;i<hi;i++)p.push(pt(a,i));return mono(p)};
  const area=a=>line(a)+`L${W},${H-4}L0,${H-4}Z`;
  return `<svg class="day-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${area(aa)}" fill="var(--yellow)" opacity=".18"/><path d="${area(sh)}" fill="var(--green)" opacity=".45"/>${per==='peter'?`<path d="${line(res.A.c)}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>`:''}<path d="${line(aa)}" fill="none" stroke="var(--yellow)" stroke-width="1.6"/><line x1="0" x2="${W}" y1="${H-4}" y2="${H-4}" stroke="var(--line)"/></svg>`;
}

  const big=(l,v,c='')=>`<div><div class="xs mut b" style="text-transform:uppercase;letter-spacing:.1em">${l}</div><div class="b" style="font-size:24px;letter-spacing:-.04em;margin-top:4px${c?';color:'+c:''}">${v}</div></div>`;

      lead:`Najlepší čas na spotrebu je <b>${wtxt}</b> (odhad ${fm(pot.peter.recv*(1-unc),1)} – ${fm(pot.peter.recv*(1+unc),1)} kWh).`,
      acts:`<button class="btn" data-act="view:rewards">Naplánovať spotrebu →</button>${S.jury?`<button class="btn ghost" data-act="tour">🎬 Demo príbeh</button>`:''}`,aside:nowWidget(per,res)});

      lead:`Vaša cena <b>${fpr(S.p.price)} €/kWh</b>, po provízii ${BR()} vám zostane <b>${fpr(netPrice(S.p.price))} €/kWh</b>.${S.bat.on?` Večer z batérie <b>${fpr(S.bat.price)} €/kWh</b>.`:''}`,
      acts:`<button class="btn" data-act="view:market">Pozrieť dopyt →</button>${S.jury?`<button class="btn ghost" data-act="tour">🎬 Demo príbeh</button>`:''}`,aside:nowWidget(per,res)});
  h+=banner();

  /* 6b – Váš deň: súhrn dňa doteraz + prehrávač */

    story=a.recv>.005?`Dnes ste od suseda dostali <b>${fm(a.recv,1)} kWh</b>${a.recvBat>.005?` (z toho ${fm(a.recvBat,1)} kWh večer z batérie)`:''} a ušetrili <b>${eur(a.saved)}</b>. Najlepší čas: ${wtxt}.`
      :`Zatiaľ ste dnes od suseda nič nedostali – ${first?`prvá elektrina zo slnka príde okolo <b>${I2T(first.i)}</b>.`:'dnes sa slnko neukázalo.'}`}
  else{const a=sim.anna;
    story=a.shared+a.batSold>.005?`Dnes ste susedom predali <b>${fm(a.shared+a.batSold,1)} kWh</b> a čisto zarobili <b>${eur(a.net)}</b>.${a.vykup>.005?` Zvyšok ${fm(a.vykup,1)} kWh išiel výkupcovi.`:''}`
      :`Zatiaľ ste dnes nič nepredali – ${first?`prvý predaj čakáme okolo <b>${I2T(first.i)}</b>.`:'dnes bez prebytku.'}`}
  h+=secHead('Váš deň · do '+now,'Čo sa dnes stalo','Prehrajte si deň – graf ukáže krok po kroku, odkiaľ prišla vaša elektrina.');

    <div class="row" style="margin-top:16px"><button class="btn pri" data-act="player">${icon('play')}Prehrať môj deň</button><button class="link" data-act="rtabgo:rep">Podrobný graf v Prehľadoch →</button></div></div>${daySpark(res,per)}</div>`;
  h+=secHead('Slnečný klub','Malá zmena, lepší výsledok.','Presuňte existujúcu spotrebu do slnečného okna. Body sa pripíšu až po overení podľa merania IMS.');

function heat(){

 <section class="lp-section" id="lp-faq"><div class="lp-wrap lp-faq"><div><span class="kicker">Dobré otázky si zaslúžia jasné odpovede</span><h2>Poďme si to rozsvietiť<span class="sig">.</span></h2><p class="lead">Zdieľanie bez zbytočného žargónu.${isOn('chat')?' Ak niečo chýba, opýtajte sa nášho demo asistenta.':''}</p><button class="link" style="margin-top:24px" data-act="chat">Opýtať sa asistenta →</button></div><div>
 <details><summary>Kto za Zdieľňou stojí?</summary><p>Zdieľňu prevádzkuje váš dodávateľ elektriny. Ktorý to je, uvidíte po zadaní EIC – podľa neho sa aplikácia prispôsobí. Údaje o výrobe a spotrebe pochádzajú z vášho inteligentného elektromera a vyúčtovanie zdieľanej elektriny vám pripraví dodávateľ, nie cudzí človek.</p></details>
 <details id="eic-faq"><summary>Kde nájdem EIC a čo sa po zadaní stane?</summary><p>EIC je 16-miestny identifikátor odberného miesta. Nájdete ho na faktúre alebo v zákazníckom účte pri údajoch o odbernom mieste. V tomto prototype kód neoverujeme v externom systéme. Ukážkové kódy načítajú len modelový profil; vlastný kód neposielame na server.</p></details>
 <details><summary>Môžem sa zapojiť aj bez fotovoltiky?</summary><p>Áno. Ako odberateľ môžete využívať prebytky iných výrobcov. Rozhoduje dostupnosť vhodnej ponuky a časový súbeh vašej spotreby s výrobou.</p></details>
 <details><summary>Ušetrím uvedenú sumu z celého účtu?</summary><p>Ukazujeme úsporu na cene zdieľanej elektriny oproti porovnávanej cene dodávky. Distribučné, regulované a fixné poplatky tým automaticky nezanikajú. Odhad nie je garantovaný výsledok.</p></details>
 <details><summary>Čo ak ešte nemám inteligentný elektromer?</summary><p>V deme si môžete pozrieť odhad aj bez neho. Pre aktívne zdieľanie potrebujete vhodné intervalové meranie a splnenie podmienok zapojenia. Prototyp obsahuje aj virtuálnu žiadosť o IMS.</p></details>
 <details><summary>Začne sa zdieľanie hneď po zadaní EIC?</summary><p>Nie. Najskôr si pozriete ponuku, potvrdíte potrebné údaje a súhlasy a odošlete žiadosť. Zdieľanie začne až po schválení a aktivácii. Jedno odberné miesto môže byť aktívne len v jednej skupine zdieľania.</p></details>
 <details><summary>Môžem si elektrinu z obeda nechať na večer?</summary><p>Zdieľanie sa vyhodnocuje v rovnakých 15-minútových intervaloch. Presun na večer vyžaduje skutočné uloženie energie, napríklad do fyzickej batérie. Samotné zdieľanie ju neukladá.</p></details>
 </div></div></section>

function grpEst(g,isP){
  const a=agg(potRun()),d=S.sim.days,f=g.f,dp=g.dp||0;
  if(isP){const k=(a.anna.shared+a.anna.batSold)*d*f;return {k,m:a.anna.vsVykup*d*f+dp*k,price:(a.anna.shared+a.anna.batSold>0?(a.anna.shared*S.p.price+a.anna.batSold*S.bat.price)/(a.anna.shared+a.anna.batSold):S.p.price)+dp}}
  const k=a.peter.recv*d*f;return {k,m:a.peter.saved*d*f-dp*k,price:(a.peter.recv>0?a.peter.paid/a.peter.recv:S.p.price)+dp};
}

    extra:regSteps(sent?2:1),
    aside:hstat(isP?'Odhad zárobku navyše':'Odhad úspory','až '+eur0(bm*(1+(UNC[S.p.conf]||.2))),'ročne v skupine '+best.name)+hstat('Môže zdieľať',`${ims?1:0} z 2 OM`,'chata potrebuje IMS')})}
   <div class="card"><span class="kicker">Výsledok overenia</span><h3>Čo sme o vás zistili</h3><div class="vf-grid">${rows.join('')}</div></div>
   <div class="card"><span class="kicker">Krok 2 · Nájdite svoju zhodu</span><h3>${sent?'Čo robiť teraz':'Čo máte urobiť'}</h3>${todo}
    ${sent?'':`<div style="margin-top:16px">${grpCompare(isP,S.ob.group,'grp2')}</div><p class="xs mut" style="margin-top:8px">Odhad pre vaše odberné miesto z modelového dňa (${S.sim.days} slnečných dní v mesiaci), nie garancia. Skutočná suma závisí od počasia a od toho, kedy spotrebúvate.</p>`}</div>
   ${sent?'':`<div class="card"><h3>Potvrďte súhlas a odošlite žiadosť</h3><div style="margin-top:8px">${F('Súhlasím s použitím 15-minútových dát z inteligentného merania','ob.consent',{t:'c'})}</div>${condList()}
    <div class="row" style="margin-top:14px"><button class="btn pri lg" data-act="ssosubmit" ${S.ob.consent?'':'disabled'}>Odoslať žiadosť do skupiny ${g.name} →</button><button class="btn" data-act="regback">Zmeniť spôsob</button></div>${S.ob.consent?'':'<p class="xs mut" style="margin-top:6px">Tlačidlo sa odomkne po zaškrtnutí súhlasu.</p>'}</div>`}
   <div class="card"><span class="kicker">${sent?'Čo bude ďalej':'Čo sa stane po odoslaní'}</span><h3>Od žiadosti po prvé vyúčtovanie</h3>${regTimeline(isP,sent?'PENDING':'NONE',g)}
    ${sent?`<div class="row" style="margin-top:16px"><button class="btn pri" data-act="view:group">Moja skupina →</button><button class="btn" data-act="view:home">Pozrieť, ako bude vyzerať Domov</button></div>`:''}</div></div>`;
}

<script>
/* js/views-map.js */
'use strict';
/* ---------- mapa odberných miest ----------
   Tri oblasti: Západ (ZSE), Stred (SSE – zdieľanie zatiaľ nie je dostupné, žiadne OM),
   Východ (VSE). Vizuál podľa úvodnej stránky: tmavý pás, izometrické domčeky, bodkované toky. */
const MAP_H=420;
function mapMembers(){
  const per=S.persona;
  const L=[
   {id:'anna',addr:S.om.anna.addr,pv:true,bat:S.bat.on,role:'Výrobca'+(S.bat.on?' s batériou':''),own:per==='anna',label:per==='anna'?'Vy':'Anna',ims:S.p.ims,grp:gname(S.group),live:true},
   {id:'peter',addr:S.om.peter.addr,bistro:true,role:'Odberateľ (bistro)',own:per==='peter',label:per==='peter'?'Vy':'Peter',ims:S.c.ims,grp:gname(S.group),live:true},
   {id:'peter2',addr:'Záhradná 3, Piešťany',role:'Odberateľ (chata)',label:per==='peter'?'chata':'',ims:false,grp:'—'},
   {id:'B',addr:'Nitra',pv:true,role:'Výrobca',label:'',ims:true,grp:gname(S.group)},
   {id:'C',addr:'Hlohovec',role:'Odberateľ',label:'',ims:true,grp:gname(S.group)},
   {id:'D',addr:'Bratislava',role:'Odberateľ (EV)',label:'',ims:true,grp:gname(S.group)},
   {id:'V1',addr:'Prešov',pv:true,bat:true,role:'Výrobca s batériou',ims:true,grp:'Poludnie 9'},{id:'V2',addr:'Košice',bistro:true,role:'Odberateľ (reštaurácia)',ims:true,grp:'Poludnie 9'},{id:'V3',addr:'Košice',role:'Odberateľ',ims:true,grp:'Poludnie 9'},{id:'V4',addr:'Michalovce',role:'Odberateľ',ims:true,grp:'Poludnie 9'},{id:'V5',addr:'Poprad',pv:true,role:'Výrobca',ims:true,grp:'Poludnie 9'}];
  if(S.don.on||S.agent.on&&agentPlan().donPct>0){const r=RCP[S.don.rcp];L.push({id:'rcp',addr:r.name,role:'Príjemca Solidárneho slnka',label:r.ic,ims:true,grp:'Solidárne slnko',rcp:true})}
  for(const g of S.gifts){const c=CONTACTS[g.to];if(c&&!L.find(x=>x.id==='k_'+g.to))L.push({id:'k_'+g.to,addr:c.town,role:'Príjemca darčeka – '+c.name,label:'🎁',ims:true,grp:'Pošli slnko'})}
  const placed=[];
  for(const m of L){const g=geo(m.addr);let [x,y]=prj(g.ll);for(let k=0;k<10&&placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<36);k++){x+=k%2?-34:30;y+=k%2?16:10}placed.push([x,y]);m.x=x;m.y=y;m.reg=regionOf(g.ll);m.town=g.town}
  /* v strede (SSE) sa elektrina neponúka – takéto OM sa na mape nezobrazí ako aktívne */
  return L.filter(m=>m.reg!=='sse'||m.own);
}
/* legenda = prepínače zvýraznenia (S.mapHi) */
const MAP_KEYS=[['zse','var(--map-zse-roof)','oblasť ZSE'],['sse','var(--map-sse-ink)','oblasť SSE – mimo služby'],['vse','var(--map-vse-roof)','oblasť VSE'],['flow','var(--map-flow)','tok cez deň'],['bat','var(--map-bat)','z batérie'],['gift','var(--map-gift)','dar / darček'],['noims','','OM bez IMS']];
function mapLegend(){
  return `<div class="map-legend" role="group" aria-label="Zvýrazniť na mape">${MAP_KEYS.map(([k,c,l])=>`<button class="${k==='noims'?'dash':''}" data-act="maphi:${k}" aria-pressed="${S.mapHi===k}">${c?`<i style="background:${c}"></i>`:''}${l}</button>`).join('')}</div>`;
}
/* veta pod mapou: čo je zvýraznené */
function mapNote(M,F_){
  const hi=S.mapHi;if(!hi)return 'Kliknite na štítok a mapa zvýrazní vybranú časť.';
  if(hi==='sse')return 'Stredné Slovensko (SSE) je zatiaľ mimo služby – žiadne odberné miesta.';
  if(hi==='zse'||hi==='vse'){const L=M.filter(m=>m.reg===hi),pv=L.filter(m=>m.pv).length;return `Oblasť ${hi.toUpperCase()} – ${L.length} odberných miest, z toho ${pv} ${pv===1?'výrobca':pv<5?'výrobcovia':'výrobcov'}.`}
  if(hi==='noims'){const n=M.filter(m=>!m.ims).length;return n?`Bez inteligentného merania: ${n} ${n===1?'odberné miesto':'odberné miesta'} – zatiaľ nemôžu aktívne zdieľať.`:'Všetky odberné miesta majú IMS.'}
  const L=F_.filter(f=>f.t===hi),k=sum(L.map(f=>f.k)),lab={flow:'Toky cez deň',bat:'Toky z batérie',gift:'Dary a darčeky'}[hi];
  if(!L.length)return hi==='gift'?'Zatiaľ žiadne dary – zapnite Solidárne slnko alebo pošlite slnko.':lab+': práve teraz žiadne.';
  return `${lab}: ${L.length} ${L.length===1?'spojenie':L.length<5?'spojenia':'spojení'}, práve teraz ${fm(k,2)} kWh za 15 minút.`;
}
function vMap(){
  const res=dayRun(),cur=Math.min(95,S.sim.idx),P=res.P,M=mapMembers(),by=Object.fromEntries(M.map(m=>[m.id,m]));
  const kw=(f)=>sum(res.recs.filter(r=>r.i===cur&&f(r)).map(r=>r.kwh));
  const bell=P.fpFull[cur],bs=batSupply(potRun())[cur],rm=RM();
  const F_=[],FL='var(--map-flow)',BT='var(--map-bat)',GF='var(--map-gift)';
  const add=(id,a,b,k,col,mk,o={})=>{if(by[a]&&by[b])F_.push({id,a:by[a],b:by[b],k,col,mk,t:mk==='q'?'bat':mk==='h'?'gift':'flow',...o})};
  add('fl_ap','anna','peter',kw(r=>r.from==='anna'&&r.to==='peter'&&!r.src&&!r.kind),FL,'m');
  add('fl_ab','anna','peter',kw(r=>r.from==='anna'&&r.to==='peter'&&r.src==='bat'),BT,'q',{bend:-.3});
  const oth=S.sim.others;
  add('fl_bc','B','C',oth?kw(r=>r.from==='B'&&r.to==='C'):bell*.3,FL,'m');
  add('fl_bd','B','D',oth?kw(r=>r.from==='B'&&r.to==='D'):bell*.25,FL,'m');
  add('fl_ac','anna','C',oth?kw(r=>r.from==='anna'&&r.to==='C'):0,FL,'m',{bend:.3});
  add('fl_v2','V1','V2',bell*.45,FL,'m');add('fl_v3','V1','V3',bell*.3,FL,'m',{bend:-.3});
  add('fl_vb','V1','V2',bs*.7,BT,'q',{bend:.35});
  add('fl_v4','V5','V4',bell*.35,FL,'m',{bend:.12});
  if(by.rcp)add('fl_rc','anna','rcp',kw(r=>r.kind==='don'),GF,'h',{bend:.4});
  for(const g of S.gifts)if(by['k_'+g.to])add('fl_k'+g.to,'anna','k_'+g.to,kw(r=>r.kind==='gift'&&r.to==='gift:'+g.to),GF,'h',{bend:.18});
  const now=sum(F_.map(f=>f.k)),sel=S.mapSel&&by[S.mapSel]?by[S.mapSel]:null;
  const hi=S.mapHi,isReg=['zse','sse','vse'].includes(hi),isFl=['flow','bat','gift'].includes(hi);
  let svg=`<svg viewBox="0 28 ${MAPW} ${MAP_H-28}" role="img" aria-label="Mapa Slovenska – oblasti ZSE, SSE a VSE s odbernými miestami a tokom elektriny v intervale ${I2T(cur)}">${arrowDefs()}${mapBase(MAP_H,hi)}`;
  for(const f of F_){const fc=isFl?(f.t===hi?'hi':'dim'):isReg?(f.a.reg===hi&&f.b.reg===hi?'':'dim'):hi==='noims'?'dim':'';
    svg+=`<g class="mfl ${fc}">${flowSvg(f.id,[f.a.x,f.a.y-4],[f.b.x,f.b.y-4],f.k,f.col,{mk:f.mk,bend:f.bend,dot:true})}</g>`}
  const outRes=agg(res);
  for(const m of [...M].sort((a,b)=>a.y-b.y)){const glow=m.pv?(m.id==='anna'?res.A.a[cur]*res.share:bell*.8)/Math.max(.2,Math.max(...P.fpFull)):0;
    const soc=m.bat?(m.id==='anna'?res.R.soc[cur]/Math.max(.1,S.bat.cap):(cur>=72?Math.max(.15,1-(cur-72)/16):Math.min(1,.2+Math.max(0,cur-40)/24))):0;
    const dim=isReg?m.reg!==hi:isFl?!F_.some(f=>f.t===hi&&(f.a===m||f.b===m)):hi==='noims'?m.ims:false;
    svg+=mapHouse(m.x,m.y,{roof:m.reg,pv:m.pv,bat:m.bat,soc,glow,bistro:m.bistro,own:m.own,noims:!m.ims,label:m.label,sel:sel===m,big:m.own,dim,hi:hi==='noims'&&!m.ims,act:'mapsel:'+m.id,aria:`${m.role}, ${m.town}`})}
  svg+=`</svg>`;
  const ownM=M.find(m=>m.own),ownSse=ownM&&ownM.reg==='sse';
  let card='';
  if(sel){
    let det='';
    if(sel.id==='anna')det=`<tr><td>Dnes predané (deň + večer)</td><td class="n">${fm(outRes.anna.shared+outRes.anna.batSold,2)} kWh</td></tr><tr><td>Čistý príjem dnes</td><td class="n">${eur(outRes.anna.net)}</td></tr><tr><td>Batéria teraz</td><td class="n">${S.bat.on?fm(res.R.soc[cur],1)+' / '+fm(S.bat.cap,0)+' kWh':'—'}</td></tr>`;
    else if(sel.id==='peter')det=`<tr><td>Dnes prijaté</td><td class="n">${fm(outRes.peter.recv,2)} kWh</td></tr><tr><td>Zaplatené dnes</td><td class="n">${eur(outRes.peter.paid)}</td></tr><tr><td>Úspora dnes</td><td class="n">${eur(outRes.peter.saved)}</td></tr>`;
    else det=`<tr><td colspan="2" class="mut">Anonymizovaný člen – toky sú ilustračné, odvodené z rovnakého profilu výroby.</td></tr>`;
    card=`<div class="card" style="border-left:5px solid ${sel.reg==='vse'?'var(--map-vse-roof)':'var(--map-zse-roof)'}"><div class="row between"><div><span class="kicker" style="margin-bottom:4px">${REG[sel.reg].name} · ${REG[sel.reg].co}</span><h3>${sel.own?'🏠 Vaše odberné miesto':esc(sel.role)}</h3></div><button class="btn sm" data-act="mapsel:" aria-label="Zavrieť kartu">✕</button></div><table style="margin-top:8px"><tbody><tr><td>Rola</td><td class="n">${esc(sel.role)}</td></tr><tr><td>Lokalita (približne)</td><td class="n">${esc(sel.own?sel.addr:sel.town.replace(/\b\w/g,c=>c.toUpperCase()))}</td></tr><tr><td>IMS</td><td class="n">${sel.ims?'✓ áno':'✕ chýba'}</td></tr><tr><td>Skupina</td><td class="n">${esc(sel.grp||'—')}</td></tr>${det}</tbody></table></div>`;
  }
  return `<div class="gap"><section class="card hero map-hero">
    <div class="map-head"><div><span class="kicker">Mapa odberných miest · ${I2T(cur)}</span><h1>Slnko práve <em>spája susedov.</em></h1><p class="lead">Vaše OM aj ostatní členovia (anonymizovane), umiestnení približne podľa adresy. Bodky ukazujú, kade práve tečie elektrina.</p></div>
     <div class="row"><span class="seg" role="group" aria-label="Čas na mape"><button data-act="mapt:48" aria-pressed="${cur===48}">☀ Poludnie</button><button data-act="mapt:78" aria-pressed="${cur===78}">🌙 Večer</button></span></div></div>
    <div class="map-svg">${svg}</div>${mapLegend()}<p class="map-note" aria-live="polite">${mapNote(M,F_)}</p>
   </section>
   ${ownSse?`<div class="card" style="border-left:5px solid var(--orange)"><b>Vaše odberné miesto je na Strednom Slovensku.</b><p class="sm mut" style="margin-top:4px">V oblasti SSE zatiaľ nie je možné elektrinu ponúkať ani odoberať. Zdieľanie je dostupné v oblastiach ZSE a VSE.</p></div>`:''}
   ${simBar()}
   <div class="grid g4">${kpi('Interval',I2T(cur)+'–'+I2T(cur+1))}${kpi('Tečie práve teraz',fm(now,2)+' kWh','za 15 minút, všetky skupiny')}${kpi('Vaša skupina dnes',fm(outRes.anna.shared+outRes.anna.batSold,1)+' kWh','Anna → Peter (deň + 🔋)')}${kpi('Oblasti v službe','ZSE · VSE','Stred (SSE) zatiaľ mimo služby')}</div>
   ${card}
   <p class="note">${rm?'Animácia je vypnutá podľa nastavenia „obmedziť pohyb“ – smer toku ukazujú šípky. ':''}Kliknite na domček pre detail. Polohu vášho OM zmeníte adresou v Profile.</p></div>`;
}

<script>
/* js/views-ideas.js */
'use strict';
/* ---------- nápady ---------- */
/* stav podľa pripomienok (obr. 8): ok = ponechať, q = na zváženie */
const IDEAS=[
 ['i_badge','award','Varíme zo slnka od suseda','Značka a certifikát pre malé podniky, ktoré varia z lokálneho slnka.','ok'],
 ['i_sol','heart','Solidárne slnko','Darujte časť prebytku tým, ktorí to potrebujú – bez provízie a poplatkov.','ok'],
 ['i_agent','bot','AI správca','Agenti vyjednávajú ceny a spravujú vašu energiu každých 15 minút.','ok'],
 ['i_send','gift','Pošli slnko','Pošlite kWh babke do Košíc ako darček.','ok'],
 ['i_ev','car','Elektromobil ako batéria ulice','Auto sa cez deň nabije zo striech a večer pomôže bistru.','ok'],
 ['i_bank','bank','Slnečná banka','Uložte si júlové slnko na Vianoce a plaťte ním v bistre.','q'],
 ['i_twin','city','Živé dvojča mesta','Potiahnite slnko a oblak – celé mestečko sa prepočíta naživo.','q']];
const ideaCard=([id,ic,t,d,st])=>`<button class="idea ${st==='q'?'q':''}" data-act="view:${id}"><span class="row between" style="width:100%"><span class="ico">${icon(ic)}</span>${st==='q'?pill('o','? na zváženie'):''}</span><b style="font-size:18px;letter-spacing:-.02em">${t}</b><span class="sm mut">${d}</span><span class="b go">Otvoriť →</span></button>`;
function vIdeas(){
  const ok=IDEAS.filter(x=>x[4]==='ok'),q=IDEAS.filter(x=>x[4]==='q');
  return `<div class="gap">${hero({kicker:'Vízie',title:'Kam môže Zdieľňa <em>rásť.</em>',lead:'Sedem vízií s vlastnou interaktívnou ukážkou – všetky počítajú tým istým enginom ako celá aplikácia. Ide o koncepty, nie existujúce produkty.',aside:hstat('Ponechávame',String(ok.length),'nápadov')+hstat('Na zváženie',String(q.length),'Slnečná banka, Živé dvojča')})}
  ${secHead('Ponechávame','Nápady, ktoré rozvíjame.')}<div class="ideas">${ok.map(ideaCard).join('')}</div>
  ${secHead('Otvorená otázka','Na zváženie.','Tieto vízie zatiaľ nie sú rozhodnuté – ponechať, alebo odstrániť?')}<div class="ideas">${q.map(ideaCard).join('')}</div></div>`;
}
function ideaHead(id,story){
  const k=IDEAS.findIndex(x=>x[0]===id),[,ic,t,,st]=IDEAS[k],prev=IDEAS[(k+IDEAS.length-1)%IDEAS.length],next=IDEAS[(k+1)%IDEAS.length];
  return hero({cls:'ihero compact',top:`<button class="btn ghost sm" data-act="view:ideas">← Všetky nápady</button><span class="pill n">Nápad ${k+1} / ${IDEAS.length}</span><span class="pill n">Vízia / koncept</span>${st==='q'?pill('o','? na zváženie'):''}`,
    kicker:'Nápad',title:t,lead:story,
    foot:`<button class="btn ghost sm" data-act="view:${prev[0]}">← ${prev[2]}</button><button class="btn ghost sm" data-act="view:${next[0]}">${next[2]} →</button>`});
}
const gains=(cu,co)=>`<div class="gains"><div class="card" style="border-top:5px solid var(--green)"><h3>Čo z toho má zákazník</h3><ul class="sm">${cu.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card" style="border-top:5px solid var(--brand)"><h3>Čo z toho má ${BR()}</h3><ul class="sm">${co.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
function badgeShare(){const a=agg(dayRun()),sh=a.peter.cons>0?a.peter.recv/a.peter.cons:0,lv=sh>=.6?'zlato':sh>=.4?'striebro':sh>=.2?'bronz':null;return {sh,lv,a}}
const LVC={zlato:['#b8860b','🥇'],striebro:['#8a94a6','🥈'],bronz:['#a0522d','🥉']};
function stickerSvg(name,sh,lv,month){
  const [c,md]=LVC[lv]||['#5d6675','☀'],qr=QR(`Zdieľňa | ${name.slice(0,24)} | ${Math.round(sh*100)} % slnka od susedov | ${month}`),n=qr.length;
  let q='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr[y][x])q+=`M${x},${y}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Nálepka Varíme zo slnka od suseda"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3b1f"/><stop offset=".6" stop-color="#14833b"/><stop offset="1" stop-color="#e7a400"/></linearGradient></defs><circle cx="200" cy="200" r="196" fill="url(#sg)"/><circle cx="200" cy="200" r="182" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 7" opacity=".8"/>
  <text x="200" y="74" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle">VARÍME ZO SLNKA</text><text x="200" y="100" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle">OD SUSEDA</text>
  <g transform="translate(130,116)"><rect width="140" height="140" rx="10" fill="#fff"/><g transform="translate(10,10) scale(${(120/n).toFixed(4)})"><path d="${q}" fill="#111"/></g></g>
  <text x="200" y="292" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle">NASKENUJTE</text>
  <text x="200" y="320" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle">a pozrite, koľko slnka je vo vašom obede</text>
  <text x="200" y="350" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle">${esc(name.slice(0,26))} · ${esc(month)}</text>
  <circle cx="330" cy="88" r="30" fill="${c}" stroke="#fff" stroke-width="3"/><text x="330" y="96" font-size="24" text-anchor="middle">${md}</text></svg>`;
}

/* AI správca – záznam vyjednávania odvodený z alokácií enginu */
function agentLog(){
  const was=S.agent.on;if(!was)S.agent.on=true;
  let res,plan,base,withA;
  try{plan=agentPlan();res=dayRun();withA=agg(res)}finally{S.agent.on=was}
  /* ručný režim = bez správcu a bez spotrebičov, ktoré naplánoval správca */
  const saved=(S.agent.done||[]).map(([ow,k])=>{const o=A_(ow,k);return [o,o.time,o.accepted]});
  S.agent.on=false;saved.forEach(([o])=>{o.time=o.orig;o.accepted=false});
  try{base=agg(dayRun())}finally{S.agent.on=was;saved.forEach(([o,t,ac])=>{o.time=t;o.accepted=ac})}
  const msgs=[],cx=S.agent.cancel,first=f=>{for(let i=0;i<96;i++)if(f(i))return i;return -1};
  const bid=Math.min(S.agent.maxP,S.c.max);
  msgs.push({i:0,who:'sys',txt:`Správcovia sa pripojili. Pravidlá Anny: min. ${fpr(S.agent.minA)} €/kWh, priorita „${S.agent.prio}“, cieľ ${fm(S.agent.goal,0)} kWh v Slnečnej banke do Vianoc. Pravidlá Petra: max. ${fpr(bid)} €/kWh.`});
  const iD=first(i=>res.recs.some(r=>r.i===i&&r.from==='anna'&&r.to==='peter'&&!r.src&&!r.kind));
  if(iD>=0){const k=sum(res.recs.filter(r=>r.from==='anna'&&r.to==='peter'&&!r.src&&!r.kind).map(r=>r.kwh));
    msgs.push({i:Math.max(0,iD-1),who:'a',txt:`Od ${I2T(iD)} mám prebytok. Ponúkam ${fpr(Math.max(S.agent.minA,S.p.price))} €/kWh.`});
    if(plan.deal){msgs.push({i:Math.max(0,iD-1),who:'p',txt:`Dám najviac ${fpr(bid)} €. Navrhujem ${fpr(plan.deal)} €/kWh, ak mi pošleš aj ${fm(res.R.offer[iD+2]||0.3,1)} kWh o ${I2T(iD+2)}.`});
      msgs.push({i:iD,who:'a',key:'deal',txt:`Dohoda: ${fpr(plan.deal)} €/kWh, dnes približne ${fm(k,1)} kWh.`,why:plan.why.deal})}
    else msgs.push({i:iD,who:'p',key:'deal',txt:cx.deal?'Dohoda zrušená – platí verejná cena ponuky.':'Za túto cenu nekúpim – platí verejná ponuka.',why:plan.why.deal||'Používateľ zrušil dohodu.'});}
  const iC=first(i=>res.R.ch[i]>1e-6);if(iC>=0)msgs.push({i:iC,who:'a',key:'bat',txt:`Zvyšok ukladám do batérie (${fm(sum(res.R.ch),1)} kWh dnes) – večer predám za ${fpr(S.bat.price)} €/kWh.`,why:plan.why.bat});
  const iB=first(i=>res.R.bank[i]>1e-6);if(iB>=0||plan.why.bank)msgs.push({i:iB>=0?iB:Math.max(0,iC),who:'a',key:'bank',txt:iB>=0?`Do Slnečnej banky ukladám ${fm(sum(res.R.bank),2)} kWh (${plan.bankPct} % zvyšku po batérii).`:'Do Slnečnej banky dnes neukladám.',why:plan.why.bank});
  const iDo=first(i=>res.recs.some(r=>r.i===i&&r.kind==='don'));if(iDo>=0)msgs.push({i:iDo,who:'a',key:'don',txt:`Posielam ${fm(withA.anna.don,2)} kWh cez Solidárne slnko – bez provízie.`,why:plan.why.don});
  for(const [ow,k,w] of [['c','wash','p'],['c','ev','p'],['p','pw','a'],['p','pb','a']]){const o=A_(ow,k);if(o.accepted)msgs.push({i:Math.max(0,T2I(o.time)-1),who:w,txt:`Spúšťam ${o.label} o ${o.time} (pôvodne ${o.orig}).`,why:ow==='c'?'V tomto čase je v skupine najviac prebytku – energia je lacnejšia.':'Mimo slnečného okna – uvoľní sa viac prebytku na predaj.'})}

function bdgCtx(){
  const res=dayRun(),idx=S.sim.idx,a=agg(res,idx),full=idx>=96?a:agg(res,96);
  const doneC=['wash','ev','wh','ice'].filter(k=>doneG('c',k));

  for(let i=0;i<Math.min(96,idx)&&!perfect;i++){const d=res.A.c[i];if(d<=0)continue;let r=0;for(const x of res.recs)if(x.i===i&&x.to==='peter')r+=x.kwh;if(r/d>=.6)perfect=true}

  const home=regionOf(geo(S.om.anna.addr).ll);
  return {eod:idx>=96,peterVerified:doneC.length>0,peterShift:sum(doneC.map(k=>A_('c',k).kwh)),peterPerfect:perfect,peterSaved:a.peter.saved,
    annaShared:a.anna.shared+a.anna.batSold,batSold:a.anna.batSold,annaVs:a.anna.vsVykup,annaSucc:full.anna.offered>0?full.anna.shared/full.anna.offered:0,annaErr:den>0?num/den:0,

const TIER_METALS={1:['gold'],2:['silver','gold'],3:['bronze','silver','gold']};
function bdgState(b,c){
  const base=BDG().base[b.id]||{},t=todayISO(),st={b,earned:false,ids:[],date:null,count:0,val:0,tier:-1,next:null,metal:b.metal};
  if(b.kind==='once'){const l=!!(b.live&&b.live(c));st.earned=!!base.date||l;st.date=base.date||(l?t:null);if(st.earned)st.ids.push(b.id);if(b.prog)st.prog=b.prog(c)}
  else if(b.kind==='rep'){const l=!!(b.live&&b.live(c));st.count=b.count?b.count(c):(base.count||0)+(l?1:0);st.earned=st.count>0;st.date=l||b.count&&st.count?t:base.date||null;st.today=l;if(st.earned)st.ids.push(b.id)}
  else{const v=(base.val||0)+(b.live?+b.live(c)||0:0),ms=TIER_METALS[b.tiers.length];st.val=v;
    b.tiers.forEach((th,i)=>{if(v>=th-1e-9){st.tier=i;st.ids.push(b.id+'@'+th)}});
    st.earned=st.tier>=0;st.metal=ms[Math.max(0,st.tier)];st.next=b.tiers[st.tier+1]??null;
    if(st.earned){const th=b.tiers[st.tier];st.date=(base.dates||{})[th]||t}
    st.prog=st.next!=null?[v,st.next,b.unit]:null;}
  st.secret=!!b.secret&&!st.earned;
  return st;
}

  if(v.startsWith('var(')){v=getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1).trim()).trim()}

}
function mixHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function shapePath(shape,r){
  const cx=60,cy=60,poly=pts=>'M'+pts.map(([x,y])=>(cx+x*r).toFixed(2)+','+(cy+y*r).toFixed(2)).join('L')+'Z';
  if(shape==='circle')return `M${cx-r},${cy}a${r},${r} 0 1,0 ${2*r},0a${r},${r} 0 1,0 ${-2*r},0Z`;
  if(shape==='hex')return poly([0,1,2,3,4,5].map(k=>{const a=(k*60-90)*Math.PI/180;return [Math.cos(a),Math.sin(a)]}));
  if(shape==='roof')return poly([[0,-1],[.97,-.2],[.82,.95],[-.82,.95],[-.97,-.2]]);
  if(shape==='star'){const p=[];for(let k=0;k<24;k++){const a=(k*15-90)*Math.PI/180,rr=k%2?.86:1;p.push([Math.cos(a)*rr,Math.sin(a)*rr])}return poly(p)}
  if(shape==='heart'){const s=r/46;return `M${cx},${cy+40*s}C${cx-30*s},${cy+20*s} ${cx-46*s},${cy+4*s} ${cx-46*s},${cy-14*s}C${cx-46*s},${cy-30*s} ${cx-34*s},${cy-42*s} ${cx-20*s},${cy-42*s}C${cx-10*s},${cy-42*s} ${cx-3*s},${cy-36*s} ${cx},${cy-28*s}C${cx+3*s},${cy-36*s} ${cx+10*s},${cy-42*s} ${cx+20*s},${cy-42*s}C${cx+34*s},${cy-42*s} ${cx+46*s},${cy-30*s} ${cx+46*s},${cy-14*s}C${cx+46*s},${cy+4*s} ${cx+30*s},${cy+20*s} ${cx},${cy+40*s}Z`}
  return shapePath('circle',r);
}
/* st: stav z bdgState; o.tier: vynútená úroveň (index) pre náhľad úrovní */
function badgeSvg(st,o={}){
  const b=st.b,u='bg'+(++bdgUid),shape=BCAT[b.cat].shape;

  const col=tokHex(b.col),light=mixHex(col,'#ffffff',.42),dark=mixHex(col,'#000000',.35);
  if(st.secret&&o.tier==null)return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="${shapePath(shape,50)}" fill="none" stroke="#B9B4C4" stroke-width="2.5" stroke-dasharray="6 6"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#B9B4C4" text-anchor="middle">?</text></svg>`;
  const num=b.kind==='tier'?b.tiers[Math.max(0,tier)]:null;
  const numTxt=num==null?'':num>=1000?fm(num/1000,0)+'k':String(num);
  const ico=ICONS[b.icon]||ICONS.sun,iy=num!=null?24:31,is=num!=null?1.45:1.9;
  let rays='';
  if(metal==='slnko')for(let k=0;k<16;k++){const a=k*22.5;rays+=`<path d="M60,2 L63,12 L57,12Z" fill="${M[2]}" transform="rotate(${a} 60 60)"/>`}
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
   <linearGradient id="${u}m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${M[1]}"/><stop offset=".45" stop-color="${M[2]}"/><stop offset="1" stop-color="${M[0]}"/></linearGradient>
   <linearGradient id="${u}e" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${M[1]}"/><stop offset="1" stop-color="${M[3]}"/></linearGradient>
   <radialGradient id="${u}f" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="${light}"/><stop offset=".55" stop-color="${col}"/><stop offset="1" stop-color="${dark}"/></radialGradient>
   <clipPath id="${u}c"><path d="${shapePath(shape,41)}"/></clipPath>
  </defs>
  ${rays}
  <path d="${shapePath(shape,52)}" fill="url(#${u}m)" stroke="${M[3]}" stroke-width="1" stroke-linejoin="round"/>
  <path d="${shapePath(shape,46)}" fill="url(#${u}e)" stroke-linejoin="round"/>
  <path d="${shapePath(shape,41)}" fill="url(#${u}f)"/>
  <g clip-path="url(#${u}c)"><rect x="-20" y="22" width="160" height="16" fill="#ffffff" opacity=".18" transform="rotate(-28 60 60)"/><rect x="-20" y="44" width="160" height="5" fill="#ffffff" opacity=".14" transform="rotate(-28 60 60)"/></g>
  <g transform="translate(${60-12*is},${iy}) scale(${is})" fill="none" stroke="#ffffff" stroke-width="${(2/is).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round">${ico}</g>
  ${numTxt?`<text x="60" y="${b.unit?83:87}" font-family="Figtree,Arial,sans-serif" font-size="${numTxt.length>3?17:21}" font-weight="800" fill="#ffffff" stroke="${dark}" stroke-width="2.4" paint-order="stroke" text-anchor="middle">${numTxt}</text>${b.unit?`<text x="60" y="95" font-family="Figtree,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing="1" fill="#ffffff" opacity=".9" text-anchor="middle">${esc(b.unit.toUpperCase())}</text>`:''}`:''}
  </svg>`;
}

/* ---------- obrazovka Odznaky ---------- */
const bdgLine=st=>{const b=st.b;
  if(b.kind==='tier')return `Spolu ${fm(st.val,b.unit==='€'?2:0)} ${b.unit}${st.next!=null?` · do ďalšej úrovne ${fm(Math.max(0,st.next-st.val),b.unit==='€'?2:0)} ${b.unit}`:' · najvyššia úroveň'}`;
  if(b.kind==='rep')return `Získané ${st.count}×${st.today?' · dnes +1':''}`;
  return b.how};
function bdgStatus(st){
  const b=st.b;
  if(st.secret)return `<span class="xs mut">Tajný odznak</span>`;
  if(b.kind==='rep')return st.earned?pill(st.today?'g':'n','×'+st.count):`<span class="xs mut">zatiaľ nezískaný</span>`;
  if(b.kind==='once')return st.earned?`<span class="xs mut">${fdate(st.date)}</span>`:st.prog?bdgBar(st.prog):`<span class="xs mut">zatiaľ nezískaný</span>`;
  return st.next!=null?bdgBar(st.prog):`<span class="xs mut">všetky úrovne ✓</span>`;
}
function bdgBar([v,m,unit]){const p=clamp(v/m,0,1),dec=unit==='€'?2:0;return `<div class="bdg-prog"><div class="bar y"><i style="width:${(p*100).toFixed(1)}%"></i></div><span class="xs mut">${fm(v,dec)} / ${fm(m,0)} ${unit}</span></div>`}
const bdgEarned=list=>list.filter(s=>s.earned).sort((a,b)=>(BDG().fresh[b.b.id]?1:0)-(BDG().fresh[a.b.id]?1:0)||String(b.date).localeCompare(String(a.date)));
function bdgNav(per,d){const L=bdgEarned(bdgAll(per));if(!L.length)return;const B=BDG(),k=Math.max(0,L.findIndex(s=>s.b.id===B.sel[per]));B.sel[per]=L[(k+d+L.length)%L.length].b.id}
function bdgStage(per,list){
  const earned=bdgEarned(list);
  if(!earned.length)return '';
  const B=BDG(),k=Math.max(0,earned.findIndex(s=>s.b.id===B.sel[per])),st=earned[k],b=st.b;
  return `<div class="card hero bdg-stage"><div class="row between"><span class="kicker">${B.fresh[b.id]?'Nový odznak':'Posledné odznaky'} · ${k+1} / ${earned.length}</span>${B.fresh[b.id]?pill('y','NOVÝ'):''}</div>
   <div class="bdg-show"><button class="btn ghost sm" data-act="bdgnav:-1" aria-label="Predchádzajúci odznak">‹</button>
    <button class="bdg-big" data-act="bdg:${b.id}" aria-label="Detail odznaku ${esc(b.name)}">${badgeSvg(st)}<span class="bdg-pedestal" aria-hidden="true"></span></button>
    <button class="btn ghost sm" data-act="bdgnav:1" aria-label="Ďalší odznak">›</button></div>
   <div class="bdg-cap"><h2>${esc(b.name)}${b.kind==='rep'?` <span class="bdg-x">×${st.count}</span>`:''}</h2><p>Získané ${fdate(st.date)}</p><p class="sm">${esc(bdgLine(st))}</p>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm" data-act="bdgshare:${b.id}">Zdieľať</button><button class="btn ghost sm" data-act="bdg:${b.id}">Detail</button></div></div></div>`;
}
function vBadges(per){
  const list=bdgAll(per),earnedN=list.filter(s=>s.earned).length;
  const cats=Object.keys(BCAT).filter(c=>list.some(s=>s.b.cat===c));
  return bdgStage(per,list)+`<div class="card"><div class="row between"><div><h3>Moje odznaky</h3><p class="xs mut">Tvar = kategória · kov = úroveň (bronz, striebro, zlato, slnko) · farba = význam (výroba, spotreba, zdieľanie, batéria)</p></div>${pill('n',earnedN+' / '+list.length+' získaných')}</div>
   ${cats.map(c=>{const L=list.filter(s=>s.b.cat===c),n=L.filter(s=>s.earned).length;return `<details class="bdg-group" open><summary><span>${BCAT[c].name}</span><span class="xs mut">${BCAT[c].sub} · ${n}/${L.length}</span></summary><div class="bdg-grid">${L.map(st=>{const b=st.b;
     return `<button class="bdg-item ${st.earned?'':'locked'} ${BDG().fresh[b.id]?'fresh':''}" data-act="bdg:${b.id}" aria-label="${esc(st.secret?'Tajný odznak':b.name)}, ${st.earned?'získaný':'zatiaľ nezískaný'}"><span class="bdg-ico">${badgeSvg(st)}</span><b>${esc(st.secret?'???':b.name)}</b>${bdgStatus(st)}</button>`}).join('')}</div></details>`}).join('')}
   <p class="note">Odznaky sa udeľujú až po overení podľa merania IMS a nikdy nie za vyššiu spotrebu. Nemajú peňažnú hodnotu. Opakovateľné odznaky ukazujú, koľkokrát ste ich získali.</p></div>`;
}
function bdgMini(per){
  const L=bdgAll(per).filter(s=>s.earned).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,4);
  return `<div class="bdg-mini">${L.map(st=>`<button class="bdg-mini-i" data-act="bdg:${st.b.id}" title="${esc(st.b.name)}" aria-label="${esc(st.b.name)}">${badgeSvg(st)}</button>`).join('')}<button class="link" data-act="rwtab:bdg">Všetky odznaky →</button></div>`;
}
const rewardTabs=()=>`<div class="seg" role="tablist" aria-label="Odmeny">${[['ch','Výzvy'],['bdg','Odznaky']].map(([k,l])=>`<button role="tab" data-act="rwtab:${k}" aria-pressed="${(S.rwtab||'ch')===k}">${l}</button>`).join('')}</div>`;

/* ---------- detail a odomknutie (modál) ---------- */
function bdgModal(id,isNew){
  const per=S.persona==='anna'?'anna':'peter',b=BADGES.find(x=>x.id===id);if(!b)return '';

   </div></div></div>`;
}

/* ---------- odomykanie počas dema ---------- */
function checkBadges(){
  const per=S.persona;if(per!=='anna'&&per!=='peter')return;
  /* odznak sa ukáže až po zatvorení uvítacej hlášky */
  if(S.modal==='welcome')return;
  if(PUB.includes(curView()))return;
  const B=BDG(),list=bdgAll(per),ids=new Set(list.flatMap(s=>s.ids)),cnt={};list.forEach(s=>{if(s.b.kind==='rep')cnt[s.b.id]=s.count});
  /* „videné“ = iba história, bez dneška – dnešné odomknutie sa tak ukáže aj po pretočení dňa */
  if(!B.seen[per]){const h=bdgAll(per,BDG_ZERO);B.seen[per]=h.flatMap(s=>s.ids);B.cnt[per]=Object.fromEntries(h.filter(s=>s.b.kind==='rep').map(s=>[s.b.id,s.count]))}
  const seen=new Set(B.seen[per]),fresh=[...ids].filter(i=>!seen.has(i));
  for(const [k,v] of Object.entries(cnt)){const old=B.cnt[per][k]||0;if(v>old&&old>0&&!fresh.includes(k)){const b=BADGES.find(x=>x.id===k);toast(`Odznak ${b.name} ×${v}`)}B.cnt[per][k]=Math.max(old,v)}
  if(!fresh.length)return;
  fresh.forEach(i=>seen.add(i));B.seen[per]=[...seen];
  const id=fresh[0].split('@')[0],b=BADGES.find(x=>x.id===id);B.fresh[id]=true;B.sel[per]=id;
  logEv(`${nm(per)}: nový odznak – ${b.name}`);notify('badge',per,'Nový odznak: '+b.name,b.how,'rewards:bdg');
  if(S.tourOn||S.modal){toast('Nový odznak: '+b.name);return}
  S.modal='bdgnew:'+id;$('#modal').innerHTML=modalHtml();
  const f=$('#modal [role=dialog] button');if(f)f.focus({preventScroll:true});
}
const BDG_ZERO={visits:0,eod:false,peterVerified:false,peterShift:0,peterPerfect:false,peterSaved:0,annaShared:0,batSold:0,annaVs:0,annaSucc:0,annaErr:1,don:0,gifts:0,eastWest:false,cloudy:false};
/* o polnoci sa dnešok pripočíta do histórie */
function bdgCommitDay(){
  const c=bdgCtx(),B=BDG(),t=todayISO();
  for(const b of BADGES){const base=B.base[b.id]||(B.base[b.id]={}),l=b.live?b.live(c):0;
    if(b.kind==='once'&&l&&!base.date)base.date=t;
    if(b.kind==='rep'&&!b.count&&l){base.count=(base.count||0)+1;base.date=t}
    if(b.kind==='tier'){const v0=base.val||0,v1=v0+(+l||0);base.dates=base.dates||{};b.tiers.forEach(th=>{if(v1>=th&&v0<th)base.dates[th]=t});base.val=v1}}
  B.fresh={};
}

/* ---------- zdieľanie: karta 1080×1350 ako PNG ---------- */
function bdgShare(id){
  const b=BADGES.find(x=>x.id===id),st=bdgState(b,bdgCtx());if(!st.earned){toast('Tento odznak ešte nemáte');return}
  const dk=tokHex('--surface-dark'),ac=tokHex('--accent-dark'),inner=badgeSvg(st).replace('<svg ','<svg x="290" y="300" width="500" height="500" ');

   <rect width="1080" height="1350" fill="${dk}"/><rect width="1080" height="1350" fill="url(#sp)"/>
   <text x="540" y="170" font-family="Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="${ac}" text-anchor="middle">ZÍSKAL(A) SOM ODZNAK</text>
   <ellipse cx="540" cy="860" rx="230" ry="38" fill="#000" opacity=".45"/><ellipse cx="540" cy="848" rx="230" ry="38" fill="#ffffff" opacity=".08"/>
   ${inner}
   <text x="540" y="990" font-family="Arial,sans-serif" font-size="68" font-weight="800" fill="#ffffff" text-anchor="middle">${esc(b.name)}${b.kind==='rep'?' ×'+st.count:''}</text>
   <text x="540" y="1060" font-family="Arial,sans-serif" font-size="34" fill="#d9d5e2" text-anchor="middle">${esc(bdgLine(st).slice(0,60))}</text>
   <text x="540" y="1110" font-family="Arial,sans-serif" font-size="30" fill="#b9b4c4" text-anchor="middle">${esc(fdate(st.date))}</text>
   <text x="540" y="1270" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">Zdieľňa<tspan fill="${tokHex('--sig')}">.</tspan> <tspan font-weight="400" fill="#b9b4c4">slnko od suseda · ${BR()}</tspan></text></svg>`;
  const img=new Image(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;cv.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);
    cv.toBlob(bl=>{const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='zdielna-odznak-'+b.id+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png');toast('Karta odznaku stiahnutá')}catch(e){toast('Zdieľanie sa nepodarilo')}};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Zdieľanie sa nepodarilo')};img.src=url;
}

/* ---------- uvítacia „slniečková“ hláška – raz za deň dema (S.day) ---------- */
const welcomePts=streak=>Math.min(30,5+5*streak);
function checkWelcome(){
  const per=S.persona;if(per!=='anna'&&per!=='peter')return;
  if(S.tourOn||S.modal||PUB.includes(curView()))return;
  const v=S.visit[per]||(S.visit[per]={day:0,streak:0});if(v.day===S.day)return;
  const streak=v.day===S.day-1?v.streak+1:1,pts=welcomePts(streak);
  v.day=S.day;v.streak=streak;
  if(per==='anna')S.pts.baseA+=pts;else S.pts.base+=pts;
  S.welcome={per,day:S.day,streak,pts,next:welcomePts(streak+1)};S.modal='welcome';
  logEv(`${nm(per)}: deň ${S.day} – +${pts} slnečných bodov za návštevu`);

function sunSvg(pts){

   <circle cx="100" cy="100" r="96" fill="var(--sun-glow)"/><g class="wl-rays" fill="var(--sun-2)">${r}</g>

   <text x="100" y="104" text-anchor="middle" font-size="34" font-weight="800" fill="var(--sun-ink)" font-family="Figtree,Arial,sans-serif">+${pts}</text>
   <text x="100" y="126" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2" fill="var(--sun-ink)" font-family="Figtree,Arial,sans-serif">BODOV</text></svg>`;
}
function welcomeModal(){
  const w=S.welcome;if(!w)return '';
  const h=new Date().getHours(),greet=h<10?'Dobré ráno':h<18?'Pekný deň':'Dobrý večer',name=w.per==='anna'?'Anna':'Peter';
  const pa=agg(potRun());
  const today=w.per==='anna'?`Vaša strecha je pripravená – dnes môžete susedom ponúknuť približne <b>${fm(pa.anna.offered,1)} kWh</b>.`:`Dnes môžete od susedov prijať približne <b>${fm(pa.peter.recv,1)} kWh</b> slnečnej elektriny.`;
  const st=bdgState(BADGES.find(b=>b.id==='morning'),bdgCtx()),need=st.next!=null?Math.max(0,Math.ceil(st.next-st.val)):0;
  const lead=w.streak>1?`Ste tu ${w.streak}. deň po sebe – slnko si to všíma.`:'Slnko vyšlo aj pre vás.';
  return `<div class="modal-bg" data-act="closemodal"><div class="modal welcome" role="dialog" aria-modal="true" aria-label="Uvítanie – deň ${w.day} v Zdieľni">
   <button class="btn sm wl-x" data-act="closemodal" aria-label="Zavrieť">✕</button>
   <div class="wl-sun">${sunSvg(w.pts)}</div>
   <span class="kicker">Deň ${w.day} v Zdieľni</span>
   <h2>${greet}, ${name}!</h2>
   <p class="wl-lead">${lead} Na štart máte <b>+${w.pts} slnečných bodov</b>.</p>
   <p class="sm mut">${today}</p>
   <div class="wl-next"><span class="wl-tag">Zajtra</span><span><b>+${w.next} bodov</b> za ${w.streak+1}. deň v rade · ${need>0?`ešte ${need===1?'1 deň':need<5?need+' dni':need+' dní'} do ${st.tier<0?'odznaku':{silver:'striebornej úrovne odznaku',gold:'zlatej úrovne odznaku'}[TIER_METALS[3][st.tier+1]]||'ďalšej úrovne odznaku'} <b>Ranné slniečko</b>`:'odznak <b>Ranné slniečko</b> je váš ☀'}</span></div>
   <button class="btn pri lg block" data-act="closemodal">Poďme na to ☀</button></div></div>`;
}

</script>
<script>
/* js/notify.js */
'use strict';
/* =====================================================================
   Notifikácie – zvonček v hornej lište.
   Vznikajú z udalostí dema, rešpektujú prepínače v Profile (S.notif),
   kind: pred | chal | state | price | month | badge
   ===================================================================== */
const NOTE_IC={pred:'sun',chal:'star',state:'group',price:'coins',month:'chart',badge:'award'};
/* notifikácie aktuálnej persony (Operátor ich nemá) */
const myNotes=()=>S.persona==='admin'?[]:S.notes.filter(n=>n.for==='both'||n.for===S.persona).sort((a,b)=>b.day-a.day||String(b.t).localeCompare(String(a.t)));
/* who: anna | peter | both; go: obrazovka (napr. 'group', 'reports:inv');
   o.key: tá istá neprečítaná notifikácia sa aktualizuje namiesto pridania novej */
function notify(kind,who,title,text,go,o={}){
  if(kind!=='badge'&&S.notif&&S.notif[kind]===false)return;
  const t=new Date().toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});
  /* používateľ je práve na danej obrazovke → nevznikne neprečítaná (toast stačí) */
  const here=(who==='both'||who===S.persona)&&curView()===String(go).split(':')[0];
  const key=o.key?o.key+':'+who:null,ex=key&&S.notes.find(n=>n.key===key&&!n.read);
  if(ex){Object.assign(ex,{title,text,t,day:S.day,read:here});return}
  S.notes.unshift({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),key,day:S.day,t,kind,for:who,title,text,go,read:here});

  if(from<at&&to>=at)notify('pred','both','Slnečné okno o '+I2T(w.a),`Od ${I2T(w.a)} do ${I2T(w.b)} je elektrina od susedov najlacnejšia – teraz je čas zapnúť práčku či nabíjanie.`,'home',{key:'pred'+S.day});
}
function bellPanel(){

   <div class="notes">${L.length?L.map(n=>`<button class="note ${n.read?'':'unread'}" data-act="note:${n.id}"><span class="note-ic">${icon(NOTE_IC[n.kind]||'info')}</span><span class="note-b"><b>${esc(n.title)}</b><span>${esc(n.text)}</span><span class="note-t">${n.day?'Deň '+n.day+' · ':''}${n.t}</span></span>${n.read?'':'<i class="note-dot" aria-label="neprečítané"></i>'}</button>`).join(''):`<p class="sm mut" style="padding:20px 4px">Zatiaľ nič nové. Ozveme sa pred slnečným oknom.</p>`}</div>
   <p class="xs mut" style="margin-top:8px">Čo vám posielame, nastavíte v <button class="link" data-act="view:profile">Profile</button>.</p></div></div>`;
}

  if(e.key==='Escape'){if(S.modal){ACT.closemodal()}else if(S.chat.open){ACT.chat()}else if(S.drawer){ACT.drawer();$('[data-act="drawer"]')?.focus()}return}

    if(t.dataset.drag==='sun'){S.sim.playing=false;stopTimer();S.sim.idx=e.key==='Home'?24:e.key==='End'?80:clamp(S.sim.idx+dir,24,80)}else S.twin.cloud=e.key==='Home'?40:e.key==='End'?720:clamp(S.twin.cloud+dir*20,40,720);render(false);return}

async function runTour(){
  if(S.tourOn)return;stopTimer();clearInterval(bankT);
  clearInterval(plT);const ch=S.chat;S=defaults();S.chat=ch;S.tourOn=true;S.jury=true;S.mem={anna:'NONE',peter:'NONE'};S.persona='anna';S.view='landing';S.sim.idx=0;render(true);window.scrollTo(0,0);
  const step=async(msg,fn,ms=2600)=>{if(!S.tourOn)return false;caption(msg);if(fn){fn();window.scrollTo(0,0)}await sleep(ms);return S.tourOn};
  try{
  if(!await step('<b>1/10</b> Úvod: jeden vstup cez EIC pre výrobcu aj odberateľa.',null,2400))return;
  if(!await step('<b>2/10</b> Ukážkový EIC → rovno do registrácie.',()=>{S.landing={eic:EIC_SAMPLE,error:'',checked:true};S.reg.step='choose';pubGo('register')},2600))return;
  if(!await step('<b>3/10</b> Anna je zákazníčka ZSE – stačí kliknúť a prihlási sa automaticky.',null,2200))return;
  if(!await step('Načítavame odberné miesto, IMS aj zmluvy z účtu ZSE…',()=>ACT.sso('zse'),2600))return;
  if(!await step('Súhlas, výber skupiny a žiadosť je odoslaná. Peter sa pridal tiež.',()=>{S.ob.consent=true;ACT.ssosubmit();S.mem.peter='PENDING'},2400))return;
  if(!await step('<b>4/10</b> Operátor ZSE skontroluje distribútora a aktivuje členstvá.',()=>{S.persona='admin';pubGo('admin')},2200))return;
  if(!await step('Členstvá sú aktívne.',()=>{S.mem.anna='ACTIVE';S.mem.peter='ACTIVE';logEv('Operátor aktivoval členstvá');render(true)},1500))return;
  if(!await step('<b>5/10</b> Peter v trhovisku: Smart Match nájde najlepšie spojenie – aj večernú ponuku z batérie.',()=>{S.persona='peter';pubGo('market');ACT.smart()},3200))return;

  if(!await step('<b>9/10</b> Mesačný report: deň, batéria, banka – všetko z jedného enginu.',()=>{S.sim.playing=false;stopTimer();S.sim.idx=96;S.rtab='rep';pubGo('reports')},3200))return;
  if(!await step('<b>10/10</b> Operátor vidí províziu iba od výrobcu, bilanciu každej kWh a audit súčtov.',()=>{S.persona='admin';pubGo('admin');setTimeout(()=>window.scrollTo({top:900,behavior:RM()?'auto':'smooth'}),200)},4200))return;
  }finally{S.tourOn=false;caption('')}
}

/* ---------- štart: deep link → živý čas ---------- */
/* priamy odkaz na obrazovku dema, napr. index.html#view=reports&persona=anna&t=48 */
{const h=new URLSearchParams(location.hash.slice(1));
 if(h.has('jury'))S.jury=h.get('jury')!=='0';
 if(h.get('persona')==='admin'||h.has('skin'))S.jury=true;
 if(['anna','peter','admin'].includes(h.get('persona')))S.persona=h.get('persona');
 if(VIEWS[h.get('view')])S.view=h.get('view');
 if(h.get('skin')in SKN)S.skin=h.get('skin');
 if(h.has('t'))S.sim.idx=clamp(parseInt(h.get('t'),10)||0,0,96);
 if(['ch','bdg'].includes(h.get('tab')))S.rwtab=h.get('tab')}
/* zákaznícky režim: „Práve teraz“ ide podľa hodín (ak deep link neurčil čas) */
if(!S.jury&&!new URLSearchParams(location.hash.slice(1)).has('t'))S.sim.idx=realIdx();
render(true);
setInterval(()=>{if(S.jury||S.sim.playing||S.tourOn)return;const r=realIdx();if(r===S.sim.idx)return;notifyTick(S.sim.idx,r);S.sim.idx=r;if(!S.modal&&!PUB.includes(curView()))render(false)},30000);
/* aplikácia v mobile (PWA) – service worker iba cez http(s), nie z file:// ani zo samostatného zdielna.html */
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol)&&!window.__STANDALONE)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__S=()=>S;
